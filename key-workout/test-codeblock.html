<div id="dgu-key-workout-test" style="background:#000"></div>
<script>
(function(){
  var host = document.getElementById('dgu-key-workout-test');
  if (!host || host.shadowRoot) return;
  var sec = host.closest('section');
  var blk = host.closest('.fe-block'); if (blk) blk.style.setProperty('grid-column', '2 / -2', 'important'); // the block always spans the page width
  if (sec) { sec.style.background = '#000'; var sb = sec.querySelector('.section-background'); if (sb) { sb.style.background = '#000'; sb.innerHTML = ''; } }
  var root = host.attachShadow({mode:'open'});
  root.innerHTML = '<style>' + "\n/* 30-minute scored Key Workout (CJ Nov 18): pick one key, then six parts in a set order, each scored, one overall score at the end */\n:host{\n  color-scheme:dark;\n  --bg:#000000; --surface:#181410; --fg:#f1ebe2; --muted:#a69b8d; --line:#2e2822;\n  --brand:#18CEFB; --accent:#e09a3e; --tabline:#4a4038; --accent-ink:#1a120a; --gold:#f2b25c;\n  --body:\"DGU Digits\",\"Outfit\",\"Figtree\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n}\n@media (prefers-color-scheme: light){ :host:not([data-theme=\"dark\"]){ --bg:#000000; } }\n:host[data-theme=\"dark\"]{ --bg:#000000; }\n*{box-sizing:border-box}\n[hidden]{display:none!important}\n:host{display:block;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 32px}\n.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}\nh1{font-weight:700;font-size:clamp(40px,5vw,60px);line-height:1;margin:0;letter-spacing:.01em}\nbutton{font:inherit;cursor:pointer}\nbutton:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.kacc{font-size:.62em;font-weight:400;vertical-align:.5em;margin-left:.04em}\n.head{display:flex;align-items:baseline;gap:14px 22px;flex-wrap:wrap}\n.keyname{margin-left:clamp(10px,2vw,22px);font-weight:700;font-size:clamp(40px,5vw,60px);line-height:1;color:var(--gold)}\n.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}\n.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 14px;font-weight:600;font-size:15px}\n.btn:hover{border-color:var(--accent)}\n.go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:14px 28px;font-weight:700;font-size:20px}\n.go:hover{filter:brightness(1.08)}\n/* pick a key */\n.pick{display:flex;flex-direction:column;gap:12px;max-width:780px;width:100%}\n.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.keys button{border:0;background:var(--bg);color:var(--fg);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1;padding:22px 0;min-width:0}\n.keys button:hover{background:var(--surface);color:var(--gold)}\n/* plan */\n.plan{max-width:780px;display:flex;flex-direction:column;gap:18px}\n.plan p{margin:0;color:var(--muted)}\n.parts{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.parts li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}\n.parts li:first-child{border-top:0}\n.parts .n{width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;flex:none}\n.parts .t{flex:1;min-width:0}\n.parts .t b{display:block;font-size:18px}\n.parts .t span{color:var(--muted);font-size:15px}\n.parts .m{color:var(--muted);font-size:15px;white-space:nowrap}\n.parts .pace{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}\n.parts .pace .pl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}\n.parts .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}\n.parts .seg button{font:inherit;font-size:15px;font-weight:600;min-width:42px;padding:6px 10px;background:#000;color:var(--muted);border:0;border-left:1px solid var(--line);cursor:pointer}\n.parts .seg button:first-child{border-left:0}\n.parts .seg button[aria-pressed=\"true\"]{background:#e09a3e;color:#000}\n.len{display:flex;align-items:center;gap:12px;flex-wrap:wrap}\n.len .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}\n.len .seg button{font:inherit;font-size:17px;font-weight:700;padding:8px 16px;background:#000;color:var(--muted);border:0;border-left:1px solid var(--line);cursor:pointer}\n.len .seg button:first-child{border-left:0}\n.len .seg button[aria-pressed=\"true\"]{background:#e09a3e;color:#000}\n#goBtn{width:100%}\n.parts .rec{color:#ff8a8a;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-left:8px}\n/* running */\n/* \"< Settings\" pill (CJ Nov 21, same as every Dojo tool): stops the workout and goes back to the length / speed screen */\n.sback{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:8px 18px 8px 12px;font:inherit;font-size:16px;font-weight:600;line-height:1.2;cursor:pointer;flex:none}\n.sback svg{width:18px;height:18px;flex:none}\n.sback:hover{border-color:var(--muted)}\n.bar{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}\n.steps{display:flex;gap:6px;flex:1;min-width:220px}\n.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}\n.steps i.on{background:var(--accent)}\n.steps i.done{background:var(--brand)}\n.now{font-size:20px;font-weight:700}\n.now span{color:var(--muted);font-weight:500}\n.clock{color:var(--muted);font-variant-numeric:tabular-nums}\n.panel{border:1px solid var(--tabline);border-radius:12px;padding:6px 14px 4px}\n.frame{display:block;width:100%;border:0;background:var(--bg);height:900px}\n.after{display:flex;align-items:center;justify-content:center;gap:16px 24px;flex-wrap:wrap;border:1px solid var(--brand);border-radius:12px;padding:16px}\n.after .sc{font-size:22px;font-weight:700}\n.after .sc b{font-size:34px;margin-left:8px}\n/* results */\n.final{max-width:780px;display:flex;flex-direction:column;gap:18px}\n.ov{display:flex;align-items:baseline;gap:16px}\n.ov b{font-size:clamp(64px,10vw,96px);line-height:1}\n.ov span{color:var(--muted)}\n.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,2fr) 48px;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line)}\n.row:first-child{border-top:0}\n.row .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden}\n.row .tr i{display:block;height:100%}\n.row b{text-align:right;font-size:20px}\n.acts{display:flex;gap:12px;flex-wrap:wrap}\n.credit{font-size:12px;color:#6f665b}\n@media (max-width:520px){ .row{grid-template-columns:minmax(0,1fr) 70px 40px;gap:10px} .panel{padding:4px 8px 2px} }\n\nh1,p{margin:0 0 .6em}\n" + '</style>' + "<div class=\"wrap\">\n  <header class=\"head\">\n    <h1>Key Workout Test</h1>\n    <div class=\"keyname\" id=\"keyName\" hidden></div>\n    <button class=\"btn\" id=\"changeBtn\" type=\"button\" hidden>Change key</button>\n  </header>\n\n  <section class=\"pick\" id=\"pick\" aria-label=\"Pick a major key\">\n    <div class=\"lab\">Pick a major key</div>\n    <div class=\"keys\" id=\"keys\" role=\"group\" aria-label=\"Major keys\"></div>\n  </section>\n\n  <section class=\"plan\" id=\"plan\" hidden>\n    <div class=\"len\"><span class=\"lab\">Workout length</span><span class=\"seg\" id=\"lenSeg\" role=\"group\" aria-label=\"Workout length\"><button type=\"button\" data-len=\"10\">10 min</button><button type=\"button\" data-len=\"20\">20 min</button><button type=\"button\" data-len=\"30\">30 min</button></span></div>\n    <div class=\"len\"><span class=\"lab\">Find the Note</span><span class=\"seg\" id=\"inSeg\" role=\"group\" aria-label=\"How to answer in Find the Note\"><button type=\"button\" data-in=\"mic\">Play (mic)</button><button type=\"button\" data-in=\"tap\">Tap</button></span></div>\n    <p>Six parts in a row, about <span id=\"lenTxt\">30</span> minutes. Each part gives a score, and you get one overall score at the end. Have your guitar plugged in (or a mic ready) for the three Record parts.</p>\n    <ol class=\"parts\" id=\"parts\"></ol>\n    <div><button class=\"go\" id=\"goBtn\" type=\"button\">Start the workout</button></div>\n    <p id=\"last\"></p>\n  </section>\n\n  <section id=\"run\" hidden>\n    <div class=\"bar\">\n      <button type=\"button\" class=\"sback\" id=\"backBtn\" aria-label=\"Stop the workout and go back to Settings\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"/></svg>Settings</button>\n      <div class=\"now\" id=\"now\"></div>\n      <div class=\"steps\" id=\"steps\"></div>\n      <div class=\"clock\" id=\"clock\">0:00</div>\n      <button class=\"btn\" id=\"skipBtn\" type=\"button\">Skip this part</button>\n    </div>\n    <div class=\"after\" id=\"after\" hidden><div class=\"sc\" id=\"afterSc\"></div><button class=\"go\" id=\"nextBtn\" type=\"button\">Next part</button></div>\n    <div class=\"panel\"><iframe class=\"frame\" id=\"frame\" title=\"Workout part\" allow=\"microphone; autoplay\"></iframe></div>\n  </section>\n\n  <section class=\"final\" id=\"final\" hidden>\n    <div class=\"lab\">Your score</div>\n    <div class=\"ov\" id=\"ov\"></div>\n    <div class=\"rows\" id=\"rows\"></div>\n    <div class=\"acts\"><button class=\"go\" id=\"againBtn\" type=\"button\">Do it again</button><button class=\"btn\" id=\"otherBtn\" type=\"button\">Pick another key</button></div>\n  </section>\n\n  <p class=\"credit\">Guitar sounds: tonejs-instruments by nbrosowsky, CC BY 3.0.</p>\n</div>";
  (() => {
const BASE='https://cdn.jsdelivr.net/gh/jamesrobbins43/dojo-audio@19c5f1195a2750b609e50f52bc6617b1658389ce/key-workout/wo/', RAW='https://raw.githubusercontent.com/jamesrobbins43/dojo-audio/19c5f1195a2750b609e50f52bc6617b1658389ce/key-workout/wo/', CACHE={}; let ticket=0;
const KEYS=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
// the six parts, in order, with about how long each takes (CJ Nov 18: 30 minutes at most)
const PARTS=[
  ['steps-drill','Steps Drill','Tap the note a half or whole step away. {n} questions.',3,false],
  ['find-the-note','Find the Note','Play each note on your guitar. {n} notes.',3,true],
  ['find-the-chord','Find the Chord','Tap the missing chord. {n} scales.',3,false],
  ['find-the-key','Find the Number','Tap the number of each chord. {n} problems.',4,false],
  ['chord-trainer','Chord Trainer','Play the key’s chords along with the click. One take.',5,true],
  ['numbers-play-along','Numbers Play Along','Pick your chords, warm up with the Number drill (not scored), then play along with one song. One take.',4,true],
];
// question speed (CJ Nov 18): Slow / Medium / Fast; the number of questions is sized to fit the part's minutes.
// opts = seconds per question for Slow, Medium, Fast; rev = seconds the answer stays up after each question
const SPEEDS=['Slow','Medium','Fast'];
const PACE={
  'steps-drill':   {opts:[10,6,3],  def:6,  rev:p=>p>=8?2.5:2},
  'find-the-chord':{opts:[12,9,6],  def:9,  rev:p=>(p>=8?3.5:3)+1},
  'find-the-key':  {opts:[20,14,8], def:14, rev:()=>5.5},
};
const $=id=>root.getElementById(id);
// workout length (CJ Nov 21): 10, 20 or 30 minutes; minutes for each part, in PARTS order. Chord Trainer and Numbers Play Along stay one take.
const LENGTHS={10:[1,1,1,2,2,3],20:[3,2,3,4,4,4],30:[5,4,5,6,5,5]};
const NOTES_PER_MIN=5; // Find the Note, Record mode
let len=30;
const mins=i=>LENGTHS[len][i];
function nFor(id,i){ return PACE[id]?count(id,mins(i)):id==='find-the-note'?Math.max(6,Math.round(mins(i)*NOTES_PER_MIN)):0; }
const store={ get(k,d){ try{ const v=localStorage.getItem('dgwo:'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
              set(k,v){ try{ localStorage.setItem('dgwo:'+k,JSON.stringify(v)); }catch(e){} } };
const keyHTML=n=>n[0]+(n[1]?`<span class="kacc">${n[1]}</span>`:'');
const col=s=>s>=90?'#18CEFB':s>=70?'#3ccf6e':s>=50?'#f0b429':'#ff5c5c';
let key=null, part=0, scores=[], t0=0, clockT=null;
const pace={}; PARTS.forEach(([id])=>{ if(PACE[id]) pace[id]=PACE[id].def; });
function count(id,m){ const c=PACE[id], p=pace[id]; return Math.max(6,Math.min(40,Math.floor(m*60/(p+c.rev(p))))); }

$('keys').innerHTML=KEYS.map((n,k)=>`<button type="button" data-key="${k}" aria-label="${n.replace('♭',' flat')} major">${keyHTML(n)}</button>`).join('');
function drawParts(){ $('lenTxt').textContent=len; [...$('lenSeg').children].forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.len===len)));
  [...$('inSeg').children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.in===input)));
  $('parts').innerHTML=PARTS.map(([id,t,d,,r],i)=>{ const m=mins(i); if(id==='find-the-note'&&input==='tap'){ d='Tap each note on the fretboard. {n} notes.'; r=false; } return `<li><span class="n">${i+1}</span><span class="t"><b>${t}${r?'<span class="rec">Record</span>':''}</b><span>${d.replace('{n}',nFor(id,i))}</span>`+
  (PACE[id]?`<span class="pace"><span class="pl">Speed</span><span class="seg" role="group" aria-label="Question speed, ${t}">${PACE[id].opts.map((o,k)=>`<button type="button" data-id="${id}" data-p="${o}" aria-pressed="${o===pace[id]}">${SPEEDS[k]}</button>`).join('')}</span></span>`:'')+
  `</span><span class="m">~${m} min</span></li>`; }).join(''); }
drawParts();
$('parts').addEventListener('click',e=>{ const b=e.target.closest('[data-p]'); if(!b) return; pace[b.dataset.id]=+b.dataset.p; store.set('speed',pace); drawParts(); });
// Find the Note answer: play it (mic) or tap it on the fretboard (CJ Nov 22: so the mic doesn't pick up stray sound)
let input='mic';
$('inSeg').addEventListener('click',e=>{ const b=e.target.closest('[data-in]'); if(!b) return; input=b.dataset.in; store.set('input',input); drawParts(); });
{ const si=store.get('input','mic'); if(si==='tap'||si==='mic') input=si; }
$('lenSeg').addEventListener('click',e=>{ const b=e.target.closest('[data-len]'); if(!b) return; len=+b.dataset.len; store.set('len',len); drawParts(); });
{ const sl=store.get('len',30); if(LENGTHS[sl]) len=sl; }
{ const sv=store.get('speed',{}); for(const k in sv) if(PACE[k]&&PACE[k].opts.includes(sv[k])) pace[k]=sv[k]; } drawParts();
$('steps').innerHTML=PARTS.map(()=>'<i></i>').join('');

function show(id){ ['pick','plan','run','final'].forEach(x=>$(x).hidden=x!==id); $('keyName').hidden=$('changeBtn').hidden=(id==='pick'); if(id!=='run'){ clearInterval(clockT); ticket++; $('frame').srcdoc=''; } }
function showPick(){ show('pick'); }
function showPlan(){
  show('plan'); $('keyName').innerHTML=keyHTML(KEYS[key]);
  const l=store.get('last:'+key,null);
  $('last').textContent=l?`Last time in ${KEYS[key]}: ${l.ov} overall.`:'';
}
function begin(){ part=0; scores=[]; t0=Date.now(); show('run'); clearInterval(clockT); clockT=setInterval(tick,1000); tick(); load(); }
function tick(){ const s=Math.floor((Date.now()-t0)/1000); $('clock').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
function load(){
  const [id,t]=PARTS[part];
  $('now').innerHTML=`${t} <span>· part ${part+1} of ${PARTS.length}</span>`;
  [...$('steps').children].forEach((x,i)=>x.className=i<part?'done':i===part?'on':'');
  $('after').hidden=true; $('skipBtn').hidden=false;
  $('frame').title=t+', key of '+KEYS[key].replace('♭',' flat');
  const n=nFor(id,part);
  const tap=id==='find-the-note'&&input==='tap';
  // fetch the part (pinned on jsDelivr, GitHub raw as a fallback), write the key and the pace in, show it in a same-origin frame
  const my=++ticket, f=$('frame'); f.srcdoc='<body style="background:#000"></body>';
  const cfg=n?`<script>window.KWWO={n:${n}`+(PACE[id]?`,pace:${pace[id]}`:'')+(tap?',tap:1':'')+`};<\/script>`:'';
  const get=u=>fetch(u).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); });
  (CACHE[id]||(CACHE[id]=get(BASE+id+'.html').catch(()=>get(RAW+id+'.html'))))
    .then(t=>{ if(my===ticket) f.srcdoc=cfg+t.split('new URLSearchParams(location.search).get("key")').join(String(key)); })
    .catch(()=>{ delete CACHE[id]; if(my===ticket) f.srcdoc='<body style="background:#000;color:#a69b8d;font:16px system-ui;text-align:center;padding:40px">This part could not load. Check your connection and reload the page.</body>'; });
}
function partDone(score){
  scores[part]=score; $('skipBtn').hidden=true;
  $('afterSc').innerHTML=`${PARTS[part][1]} score<b style="color:${col(score)}">${score}</b>`;
  $('nextBtn').textContent=part<PARTS.length-1?`Next: ${PARTS[part+1][1]}`:'See my score';
  $('after').hidden=false; $('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){ if(part<PARTS.length-1){ part++; load(); window.scrollTo({top:0,behavior:'smooth'}); } else finish(); }
function finish(){
  const ov=Math.round(scores.reduce((a,s)=>a+(s||0),0)/PARTS.length), mins=Math.round((Date.now()-t0)/60000);
  show('final');
  $('ov').innerHTML=`<b style="color:${col(ov)}">${ov}</b><span>overall in ${KEYS[key]}, ${mins} min</span>`;
  $('rows').innerHTML=PARTS.map(([,t],i)=>{ const s=scores[i]; return `<div class="row"><span>${t}</span><span class="tr"><i style="width:${s||0}%;background:${col(s||0)}"></i></span><b style="color:${s==null?'var(--muted)':col(s)}">${s==null?'–':s}</b></div>`; }).join('');
  store.set('last:'+key,{ov,scores,at:Date.now()});
}
window.addEventListener('message',e=>{ const d=e.data; if(!d||d.kwwo!=='done'||$('run').hidden) return; if(d.tool!==PARTS[part][0]) return; partDone(Math.max(0,Math.min(100,Math.round(+d.score||0)))); });
$('keys').addEventListener('click',e=>{ const b=e.target.closest('[data-key]'); if(!b) return; key=+b.dataset.key; showPlan(); });
$('goBtn').onclick=begin;
$('nextBtn').onclick=next;
$('skipBtn').onclick=()=>{ scores[part]=0; next(); };
$('backBtn').onclick=()=>showPlan();
$('againBtn').onclick=begin;
$('otherBtn').onclick=showPick;
$('changeBtn').onclick=showPick;

// the part's own page sets the frame's height, so the page scrolls as one
let ro=null;
function fit(){ try{ const d=$('frame').contentDocument; if(!d||!d.body) return; const w=d.querySelector('.wrap')||d.body, h=Math.ceil(w.getBoundingClientRect().bottom+(d.defaultView.scrollY||0)+parseFloat(getComputedStyle(d.body).paddingBottom))+2; if(h>120) $('frame').style.height=h+'px'; }catch(e){} }
$('frame').addEventListener('load',()=>{
  if(ro) ro.disconnect();
  try{ const d=$('frame').contentDocument; d.documentElement.style.overflow='hidden'; ro=new ResizeObserver(fit); ro.observe(d.querySelector('.wrap')||d.body); fit(); }catch(e){}
});
showPick();
})();
})();
</script>
