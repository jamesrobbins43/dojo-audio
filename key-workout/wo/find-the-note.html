/* ---------- Note pool ---------- */
function poolFor(L){ L=L||RANGE;
  const pool=[];
  for(const s of settings.strings){
    const seen=new Map();
    for(let f=L.lo; f<=L.hi; f++){
      const pc=(STRINGS[s].midi+f)%12;
      const nat=NATURAL.includes(pc);
      const kind = 'all'; if(!kwIn(pc)) continue;
      if(kind==='nat'&&!nat) continue;
      if(kind==='acc'&&nat) continue;
      if(!seen.has(pc)) seen.set(pc,[]);
      seen.get(pc).push(f);
    }
    for(const [pc,frets] of seen) pool.push({s,pc,frets});
  }
  return pool;
}
function spell(pc){ return kwName(pc);
  if(NATURAL.includes(pc)) return SHARP[pc];
  if(settings.notes==='sharp') return SHARP[pc];
  if(settings.notes==='flat') return FLAT[pc];
  return Math.random()<.5?SHARP[pc]:FLAT[pc];
}
function buildSequence(L,n){
  const pool=poolFor(L), seq=[]; let bag=[];
  while(seq.length<n){
    if(!bag.length){
      // Open-string notes (G on the G string, E on the E string...) come up only about a quarter as often
      bag=pool.flatMap(it=>it.pc===window.KW_KEY?[it,it,it]:[it]).filter(it=>!it.frets.includes(0)||Math.random()<.25).sort(()=>Math.random()-.5);
      if(!bag.length) bag=pool.slice();
    }
    let item=bag.pop();
    const prev=seq[seq.length-1];
    if(prev&&prev.pc===item.pc){ const j=bag.findIndex(x=>x.pc!==prev.pc); if(j>=0){ const t=bag[j]; bag[j]=item; item=t; } else { const ok=pool.filter(x=>x.pc!==prev.pc); if(ok.length) item=ok[Math.floor(Math.random()*ok.length)]; } }
    // a note that is also its string's open note: the answer is the octave at fret 12, marked HIGH (CJ, Nov 18)
    seq.push(item.frets.includes(0)&&item.frets.includes(12) ? {...item, frets:[12], high:true, name:spell(item.pc)} : {...item, name:spell(item.pc)});
  }

}

/* ---------- Sound (plucked string synth) ---------- */
let ctx=null; const bufCache={};
function audio(){ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ctx&&ctx.state==='suspended') ctx.resume(); return ctx; }
function pluckBuffer(midi){
  if(bufCache[midi]) return bufCache[midi];
  const a=ctx, sr=a.sampleRate, freq=440*Math.pow(2,(midi-69)/12), N=Math.round(sr/freq), len=Math.floor(sr*2.4);
  const buf=a.createBuffer(1,len,sr), d=buf.getChannelData(0), ring=new Float32Array(N);
  for(let i=0;i<N;i++) ring[i]=Math.random()*2-1;

  for(let k=0;k<2;k++) for(let i=1;i<N;i++) ring[i]=(ring[i]+ring[i-1])/2;
  let p=0; const decay=.996;
  for(let i=0;i<len;i++){ const n=(p+1)%N; const v=decay*0.5*(ring[p]+ring[n]); d[i]=ring[p]; ring[p]=v; p=n; }
  let m=0; for(let i=0;i<len;i++) m=Math.max(m,Math.abs(d[i])); for(let i=0;i<len;i++) d[i]/=m||1;

/* Recorded guitar tones (window.GUITAR_TONES[tone][midi]). The nearest recorded note is pitch-shifted with playbackRate. Falls back to the synth if decoding fails. */
const sampleCache={};
function nearestKey(tone,midi){
  const keys=Object.keys((window.GUITAR_TONES||{})[tone]||{}).map(Number);

function sampleBuffer(tone,key){

  if(!uri.startsWith('data:')) return sampleCache[id]=fetch(uri).then(r=>{ if(!r.ok) throw r.status; return r.arrayBuffer(); }).then(ab=>new Promise((res,rej)=>ctx.decodeAudioData(ab,res,rej)));
  const bin=atob(uri.split(',')[1]), bytes=new Uint8Array(bin.length);

let ringFor=2.2; // seconds the note rings before fading; shorter on Levels 9-10
function startBuffer(buf,vol,rate,when){

  sampleBuffer(tone,key).then(b=>startBuffer(b,.9,Math.pow(2,(midi-key)/12),when)).catch(()=>startBuffer(pluckBuffer(midi),.45,1,when));

function yin(d,sr){
  const W=Math.floor(d.length/2), tmin=Math.floor(sr/1000), tmax=Math.min(W-1,Math.floor(sr/70)), df=new Float32Array(tmax+1); let run=0, best=-1, t, i;

  if(best<0) return 0;
  const a=df[best-1]||df[best], c=df[best+1]||df[best], dn=a-2*df[best]+c, sh=dn>0?.5*(a-c)/dn:0;
  return sr/(best+sh);
}

<!-- Demo video play icon: opens the hidden demo video panel and plays it; Close button or Esc hides it -->
<script>
(function(){
  document.querySelectorAll('[id^="dgu-"]').forEach(function(host){

    var f = p && p.querySelector('iframe');
    if (!b || !p || !f) return;
    function close(){ f.src = 'about:blank'; p.style.display = 'none'; }
    b.addEventListener('click', function(){
      p.style.display = 'block';
      f.src = f.getAttribute('data-src') + '&autoplay=1';
    });
    if (x) x.addEventListener('click', close);
