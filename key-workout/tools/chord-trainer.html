    var L = rec.last; if (!L) return;
    var n = L.x.length, b = new DataView(new ArrayBuffer(44 + n * 2)), p = 0;
    function str(t) { for (var i = 0; i < t.length; i++) b.setUint8(p++, t.charCodeAt(i)); }
    function u32(v) { b.setUint32(p, v, true); p += 4; }
    function u16(v) { b.setUint16(p, v, true); p += 2; }
    str('RIFF'); u32(36 + n * 2); str('WAVE'); str('fmt '); u32(16); u16(1); u16(1); u32(L.sr); u32(L.sr * 2); u16(2); u16(16); str('data'); u32(n * 2);
    for (var i = 0; i < n; i++) { var v = Math.max(-1, Math.min(1, L.x[i])); b.setInt16(p, v < 0 ? v * 32768 : v * 32767, true); p += 2; }
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([b], { type: 'audio/wav' })); a.download = 'open-chords-take.wav';
    document.body.appendChild(a); a.click(); a.remove();
  }
  panel();
  // Until setup is done, the setup screen replaces the chords. "Just practice" skips it.
  function gate(on) {
    var w = root.querySelector('.w'), p = $('rp'), stg = root.querySelector('.stage');
    if (!p || w.classList.contains('gate') === on) return;
    w.classList.toggle('gate', on);
    if (on) $('setup').appendChild(p); else stg.insertBefore(p, stg.querySelector('.btns'));
  }
  // Tuner: standard tuning, nearest string, cents off. Uses the same input as recording.
  var TS = [40, 45, 50, 55, 59, 64], TN = ['E', 'A', 'D', 'G', 'B', 'E'], tun = { on: false, raf: 0, hist: [], miss: 0 };
  function tunerOpen(on) {
    if (on) demoStop(false);
    if (on && busy()) return;
    if (on && run) stop();
    tun.on = on; root.querySelector('.w').classList.toggle('tune', on); $('tnb').classList.toggle('on', on);
    cancelAnimationFrame(tun.raf);
    if (on) { tunerDraw(); tunerLoop(); }
  }
  function tunerDraw() {
    var b = $('tbox');
    if (!rec.stream) { b.innerHTML = '<div class="tcents">Plug in your guitar and connect your input.</div><button class="btn recgo" id="tcon" type="button">Connect</button>'; $('tcon').addEventListener('click', function () { connect(); var w = setInterval(function () { if (rec.stream) { clearInterval(w); if (tun.on) { tunerDraw(); tunerLoop(); } } else if (rec.state === 'idle') clearInterval(w); }, 200); }); return; }
    var h = '<div class="tnote" id="tnote">&nbsp;</div><div class="tcents" id="tcents">Play one string</div><div class="tlab"><span>Flat</span><span>In tune</span><span>Sharp</span></div><div class="tmeter"><div class="tz"></div>';
    for (var i = 0; i <= 10; i++) h += '<i class="tk" style="left:' + (i * 10) + '%"></i>';
    h += '<b class="tn idle" id="tn"></b></div><div class="tstr" id="tstr">' + TN.map(function (n) { return '<span>' + n + '</span>'; }).join('') + '</div>';
    b.innerHTML = h;
  }
  // Pitch from the input (YIN): good from low E up through the high strings.
  function yin(d, sr) {
    var W = Math.floor(d.length / 2), tmin = Math.floor(sr / 1000), tmax = Math.min(W - 1, Math.floor(sr / 60)), df = new Float32Array(tmax + 1), run2 = 0, t, i, best = -1;
    var e = 0; for (i = 0; i < d.length; i++) e += d[i] * d[i]; if (Math.sqrt(e / d.length) < .0004) return 0;
    for (t = 1; t <= tmax; t++) { var s2 = 0; for (i = 0; i < W; i++) { var v = d[i] - d[i + t]; s2 += v * v; } run2 += s2; df[t] = run2 ? s2 * t / run2 : 1; }
    for (t = tmin; t <= tmax; t++) if (df[t] < .12) { while (t + 1 <= tmax && df[t + 1] < df[t]) t++; best = t; break; }
    // As a string fades the match gets weaker: fall back to the clearest dip if it is still a clear one.
    if (best < 0) { var mn = .3; for (t = tmin; t <= tmax; t++) if (df[t] < mn) { mn = df[t]; best = t; } }
    if (best < 0) return 0;
    var a = df[best - 1] || df[best], c = df[best + 1] || df[best], dn = a - 2 * df[best] + c, sh = dn > 0 ? .5 * (a - c) / dn : 0;
    return sr / (best + sh);
  }
  function tunerLoop() {
    if (!tun.on || !rec.stream) return;
    if (!rec.tan) { rec.tan = ctx.createAnalyser(); rec.tan.fftSize = 4096; }
    if (rec.tanSrc !== rec.src) { try { rec.src.connect(rec.tan); } catch (e) {} rec.tanSrc = rec.src; }
    var d = new Float32Array(rec.tan.fftSize); rec.tan.getFloatTimeDomainData(d);
    var f = yin(d, ctx.sampleRate), note = $('tnote'), cen = $('tcents'), nd = $('tn'), ss = root.querySelectorAll('#tstr span');
    // Keep the last reading on screen while the string rings down; clear it only after 2 s of nothing.
    if (f > 70 && f < 1000) { tun.hist.push(f); if (tun.hist.length > 5) tun.hist.shift(); tun.miss = 0; } else if (++tun.miss > 120) tun.hist = [];
    if (note && tun.hist.length >= 3 && !tun.miss) {
      var hs = tun.hist.slice().sort(function (p, q) { return p - q; }), fm = hs[Math.floor(hs.length / 2)], m = 69 + 12 * Math.log(fm / 440) / Math.LN2;
      var si = 0; for (var q = 1; q < 6; q++) if (Math.abs(m - TS[q]) < Math.abs(m - TS[si])) si = q;
      var c = Math.round(100 * (m - TS[si])), ok = Math.abs(c) <= 5;
      if (Math.abs(c) > 250) { var mr = Math.round(m); c = Math.round(100 * (m - mr)); note.innerHTML = PCN[(mr % 12 + 12) % 12]; }
      else note.innerHTML = TN[si] + '<small>' + (si === 5 ? ' high' : si === 0 ? ' low' : '') + '</small>';
      cen.textContent = ok ? 'In tune' : Math.abs(c) + ' cents ' + (c > 0 ? 'sharp: tune down' : 'flat: tune up'); cen.className = 'tcents' + (ok ? ' ok' : '');
      nd.className = 'tn' + (ok ? ' ok' : ''); nd.style.left = (50 + Math.max(-50, Math.min(50, c))) + '%';
      for (q = 0; q < ss.length; q++) ss[q].className = q === si ? (ok ? 'ok' : 'on') : '';
    } else if (note && !tun.hist.length) { nd.className = 'tn idle'; }
    tun.raf = requestAnimationFrame(tunerLoop);
  }
  $('tnb').addEventListener('click', function () { tunerOpen(!tun.on); });
  $('tdone').addEventListener('click', function () { tunerOpen(false); });
  // Settings live down the left side of the chords.
  (function () { var b = root.querySelector('.bar'), stg = root.querySelector('.stage'); b.classList.add('side'); stg.insertBefore(b, stg.firstChild); })();
  // Practice or Record: picks the buttons under the chords. Record starts with setup until it's done.
  function setMode(m) {
    if (busy()) return;
    if (tun.on) tunerOpen(false);
    if (run) stop();
    demoStop(true);
    var w = root.querySelector('.w'); w.classList.toggle('m-rec', m === 'rec');
    // Record mode needs the room: hide the site's header bar while it's on.
    var sh = document.querySelector('header#header'); if (sh) sh.style.display = m === 'rec' ? 'none' : '';
    root.querySelectorAll('#mode button').forEach(function (b) { b.classList.toggle('on', b.dataset.m === m); });
    if (m === 'rec' && $('go') && (!rec.stream || !rec.synced)) { gate(true); recInfo(); } else gate(false);
    if (m === 'rec') recInfo();
    summary();
  }
  root.querySelectorAll('#mode button').forEach(function (b) { b.addEventListener('click', function () { setMode(b.dataset.m); }); });
  setMode('prac');
  $('strum').value = String(st.strum);
  $('pr').value = String(st.pr);
  $('pr').addEventListener('change', function () { st.pr = +this.value; save(); recInfo(); });
  $('strum').addEventListener('change', function () { st.strum = +this.value; save(); recInfo(); });


  // Start screen (CJ Nov 17): settings, then two examples with a black box + blue arrow per step; twice through, then stops
  var DM = null, DMok = false;
  function coach(el, text, side) {
    var w = root.querySelector('.w'), c = w.querySelector(':scope > .coach');
    if (!el) { if (c) c.classList.remove('on'); return; }
    if (getComputedStyle(w).position === 'static') w.style.position = 'relative';
    if (!c) { c = document.createElement('div'); c.className = 'coach'; c.setAttribute('aria-live', 'polite'); w.appendChild(c); }
    c.classList.remove('on', 'below', 'right'); c.textContent = text;
    var hr = w.getBoundingClientRect(), r = el.getBoundingClientRect();
    if (side === 'right' && r.right - hr.left + 48 + Math.min(340, c.offsetWidth) > hr.width - 4) side = 'below';
    if (side) c.classList.add(side);
    var cw = c.offsetWidth, chh = c.offsetHeight;
    if (side === 'right') { c.style.left = (r.right - hr.left + 48) + 'px'; c.style.top = Math.max(4, r.top - hr.top + r.height / 2 - chh / 2) + 'px'; }
    else {
      var cx = r.left + r.width / 2 - hr.left, left = Math.max(4, Math.min(hr.width - cw - 4, cx - cw / 2));
      c.style.left = left + 'px'; c.style.top = (side === 'below' ? r.bottom - hr.top + 48 : r.top - hr.top - chh - 48) + 'px';
      c.style.setProperty('--px', Math.max(14, Math.min(cw - 14, cx - left)) + 'px');
    }
    void c.offsetWidth; c.classList.add('on');
  }
  function demoBeats(on) {
    if (!DM) return; clearInterval(DM.iv); DM.iv = null; if (!on) return;
    DM.d = 0; timer(0);
    DM.iv = setInterval(function () { if (!DM) return; DM.d++; var b = DM.d % BPC; if (b === 0) move(1); timer(b); }, 60000 / st.bpm);
  }
  function demoStop(reset) {
    if (!DM) return; clearTimeout(DM.t); clearInterval(DM.iv); DM = null; coach(null);
    root.querySelector('.w').classList.remove('demo'); tagSet('Play'); timer(-1); if (reset) { pos = 0; stage(); }
  }
  function demoGo() { demoStop(true); if (!seq.length) return; DM = { i: 0, step: -1, d: 0, iv: null, t: null }; root.querySelector('.w').classList.add('demo'); tagSet('Example'); demoStep(); }
  function demoStep() {
    var k = DM.i, s = DM.step;
    function nx(ms, i, stp) { DM.t = setTimeout(function () { if (!DM) return; DM.i = i; DM.step = stp; demoStep(); }, ms); }
    if (k >= 2) { demoBeats(false); timer(-1); coach($('play'), 'Press Start when ready'); DM.t = setTimeout(function () { coach(null); }, 6000); return; } // plays once, then stops (CJ Nov 17: Chord Trainer only)
    if (s === -1) { demoBeats(false); timer(-1); pos = 0; stage();
      coach(root.querySelector('.stage > .bar') || $('key'), 'First pick your settings', 'right'); return nx(4000, k, 0); }
    if (s === 0) { if (!DM.iv) demoBeats(true); coach(root.querySelector('#cur .nm') || $('cur'), 'Press Start and play this chord along with the click.'); return nx(11000, k, 2); } // no beat-boxes box (CJ Nov 17)
    if (s === 1) { coach($('timer'), 'The boxes count the beats. Change chords each time it gets back to 1.', 'below'); return nx(11000, k, 2); }
    if (k % 2 === 0) coach(root.querySelector('.stage > .nxt'), 'The next chord shows here, so you can get ready for it.');
    else coach(root.querySelector('#mode [data-m="rec"]'), 'Switch to Record to play it through once and get a score for timing and chord quality.', 'below');
    nx(11000, k + 1, k % 2 ? -1 : 0);
  }
  $('prev').addEventListener('click', function () { demoStop(false); });
  $('next').addEventListener('click', function () { demoStop(false); });

  (function () {
    var O = window.KWOC_OPTS || [], sel = $('kwcapo'), BASE = [40, 45, 50, 55, 59, 64];
    var own = st.key;
    sel.innerHTML = O.map(function (o, i) { return '<option value="' + i + '">' + (o.capo ? 'Capo ' + o.capo : 'No capo') + ' · ' + o.shape + ' shapes</option>'; }).join('');
    function use(i) {
      var o = O[i] || O[0]; sel.value = String(O.indexOf(o));
      st.key = o.shape; window.KWOC_CAPO = o.capo;
      for (var s = 0; s < 6; s++) OPENM[s] = BASE[s] + o.capo;   // what the guitar sounds with the capo on
      var an = $('type').querySelector('option[value="anchor"]'); an.disabled = !KEYS[o.shape];
      if (!KEYS[o.shape] && st.type === 'anchor') { st.type = 'open'; $('type').value = 'open'; }
      try { localStorage.setItem('dgkp-oc-capo-' + window.KWOC_NAME, String(i)); } catch (e) {}
    }
    var saved = 0; try { saved = +localStorage.getItem('dgkp-oc-capo-' + window.KWOC_NAME) || 0; } catch (e) {}
    // triads: the real key, no capo (Chord Trainer)
    window.kwMode = function () {
      if (st.type === 'ts' && window.KWT_DIA) { st.key = 'KWT'; window.KWOC_CAPO = 0; for (var s = 0; s < 6; s++) OPENM[s] = BASE[s]; $('kwcapof').style.display = 'none'; return; }
      if (O.length) { $('kwcapof').style.display = ''; use(+sel.value || 0); } else st.key = own;
    };
    if (O.length) use(saved);
    window.kwMode();
    sel.addEventListener('change', function () { use(+this.value); refresh(); });
    $('type').addEventListener('change', function () { window.kwMode(); refresh(); });
  })();
  setBpm(st.bpm); refresh(); timer(-1);
  DMok = true; demoGo();
})();
