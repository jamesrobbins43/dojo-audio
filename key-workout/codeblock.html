<div id="dgu-key-workout-page" style="background:#000"></div>
<script>
(function(){
  var host = document.getElementById('dgu-key-workout-page');
  if (!host || host.shadowRoot) return;
  var sec = host.closest('section');
  if (sec) { sec.style.background = '#000'; var sb = sec.querySelector('.section-background'); if (sb) { sb.style.background = '#000'; sb.innerHTML = ''; } }
  var root = host.attachShadow({mode:'open'});
  root.innerHTML = '<style>' + "\n/* closed 4 (CJ, Nov 17): Outfit's 4 is open; only U+0034 comes from Figtree (OFL). Put \"DGU Digits\" FIRST in every font-family that uses Outfit. */\n\n/* Key Workout (Dojo page, CJ Nov 17): pick ONE major key, then a tab per tool; every tool only gives problems in that key */\n:host{\n  color-scheme:dark;\n  --bg:#000000; --surface:#181410; --fg:#f1ebe2; --muted:#a69b8d; --line:#2e2822;\n  --brand:#18CEFB; --accent:#e09a3e; --tabline:#4a4038; --accent-ink:#1a120a; --gold:#f2b25c;\n  --body:\"DGU Digits\",\"Outfit\",\"Figtree\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n}\n/* the Dojo tools are always on pure black, so the page stays dark in both themes */\n@media (prefers-color-scheme: light){ :host:not([data-theme=\"dark\"]){ --bg:#000000; } }\n:host[data-theme=\"dark\"]{ --bg:#000000; }\n*{box-sizing:border-box}\n[hidden]{display:none!important}\n:host{display:block;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 32px}\n.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}\nh1{font-family:\"DGU Digits\",\"Outfit\",var(--body);font-weight:700;font-size:clamp(40px,5vw,60px);line-height:1;margin:0;letter-spacing:.01em}\nbutton{font:inherit;cursor:pointer}\nbutton:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.kacc{font-size:.62em;font-weight:400;vertical-align:.5em;margin-left:.04em}\n\n/* Pick a key */\n.pick{display:flex;flex-direction:column;gap:12px;max-width:780px;width:100%}\n.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}\n.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.keys button{border:0;background:var(--bg);color:var(--fg);font-family:\"DGU Digits\",\"Outfit\",var(--body);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1;padding:22px 0;min-width:0}\n.keys button:hover{background:var(--surface);color:var(--gold)}\n.keys button[aria-pressed=\"true\"]{background:var(--accent);color:var(--accent-ink)}\n\n/* Workout */\n.head{display:flex;align-items:baseline;gap:14px 22px;flex-wrap:wrap}\n#work{margin-top:16px}   /* a little more space between the title and the tabs (CJ Nov 17) */\n.keyname{margin-left:clamp(10px,2vw,22px);font-family:\"DGU Digits\",\"Outfit\",var(--body);font-weight:700;font-size:clamp(40px,5vw,60px);line-height:1;color:var(--gold)}\n.keyname .of{color:var(--muted);font-weight:500}\n.change{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 14px;font-weight:600;font-size:15px;align-self:center}\n.change:hover{border-color:var(--accent)}\n.tabs{display:flex;flex-wrap:wrap;padding-left:1px}   /* the tabs always fill the full width; on narrow screens they wrap onto more rows (CJ Nov 17) */\n.tabs button{flex:1 0 auto;border:1px solid var(--tabline);margin:0 0 -1px -1px;background:#0d0b09;color:var(--muted);font-weight:600;font-size:17px;padding:10px 18px;white-space:nowrap}\n.tabs button:first-child{border-top-left-radius:10px}\n.tabs button:last-child{border-top-right-radius:10px}\n.tabs button:hover{color:var(--fg)}\n.tabs button[aria-selected=\"true\"]{color:var(--fg);background:var(--bg);border-bottom-color:var(--bg);box-shadow:inset 0 3px 0 var(--accent)}\n.panel{border:1px solid var(--tabline);border-top:0;border-radius:0 0 12px 12px;padding:6px 14px 4px}\n.frame{display:block;width:100%;border:0;background:var(--bg);height:900px}\n.credit{font-size:12px;color:#6f665b}\n@media (max-width:1000px){ .tabs button{font-size:15px;padding:9px 10px} }\n@media (max-width:520px){\n  .tabs button{font-size:15px;padding:9px 12px;border-radius:0!important}\n  .panel{padding:4px 8px 2px}\n}\n\nh1,p{margin:0}\n.kwerr{color:var(--muted);padding:40px 0;text-align:center}\n" + '</style>' + "<div class=\"wrap\">\n  <header class=\"head\">\n    <h1>Key Workout</h1>\n    <div class=\"keyname\" id=\"keyName\" hidden></div>\n    <button class=\"change\" id=\"changeBtn\" type=\"button\" hidden>Change key</button>\n  </header>\n\n  <section class=\"pick\" id=\"pick\" aria-label=\"Pick a major key\">\n    <div class=\"lab\">Major key</div>\n    <div class=\"keys\" id=\"keys\" role=\"group\" aria-label=\"Major keys\"></div>\n  </section>\n\n  <section id=\"work\" hidden>\n    <div class=\"tabs\" id=\"tabs\" role=\"tablist\" aria-label=\"Tools\"></div>\n    <div class=\"panel\"><iframe class=\"frame\" id=\"frame\" title=\"Tool\" allow=\"microphone; autoplay\"></iframe></div>\n  </section>\n\n  <p class=\"credit\">Guitar sounds: tonejs-instruments by nbrosowsky, CC BY 3.0.</p>\n</div>";
  (() => {
const BASE='https://cdn.jsdelivr.net/gh/jamesrobbins43/dojo-audio@610ebf5534453cf5aa3c2833cc73673772f5f5b8/key-workout/tools/', RAW='https://raw.githubusercontent.com/jamesrobbins43/dojo-audio/610ebf5534453cf5aa3c2833cc73673772f5f5b8/key-workout/tools/', CACHE={}; let ticket=0;
const KEYS=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const TOOLS=[
  ['steps-drill','Steps Drill'],
  ['find-the-note','Find the Note'],
  ['find-the-chord','Find the Chord'],
  ['find-the-key','Find the Number'],
  ['chord-trainer','Chord Trainer'],
  ['numbers-play-along','Numbers Play Along'],
];
const $=id=>root.getElementById(id);
const store={ get(k,d){ try{ const v=localStorage.getItem('dgkp:'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
              set(k,v){ try{ localStorage.setItem('dgkp:'+k,JSON.stringify(v)); }catch(e){} } };
const keyHTML=n=>n[0]+(n[1]?`<span class="kacc">${n[1]}</span>`:'');
let key=store.get('key',null), tab=store.get('tab',TOOLS[0][0]);
if(!(key>=0&&key<12)) key=null;
if(!TOOLS.some(t=>t[0]===tab)) tab=TOOLS[0][0];

$('keys').innerHTML=KEYS.map((n,k)=>`<button type="button" data-key="${k}" aria-pressed="false" aria-label="${n.replace('♭',' flat')} major">${keyHTML(n)}</button>`).join('');
$('tabs').innerHTML=TOOLS.map(([id,t])=>`<button type="button" role="tab" data-tab="${id}" aria-selected="false">${t}</button>`).join('');

function showPick(){
  $('pick').hidden=false; $('work').hidden=true; $('keyName').hidden=true; $('changeBtn').hidden=true;
  ticket++; $('frame').srcdoc='';
  root.querySelectorAll('#keys button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.key===key)));
}
function showWork(){
  $('pick').hidden=true; $('work').hidden=false; $('keyName').hidden=false; $('changeBtn').hidden=false;
  $('keyName').innerHTML=keyHTML(KEYS[key]);
  load();
}
function load(){
  root.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  const t=TOOLS.find(x=>x[0]===tab);
  $('frame').title=t[1]+', key of '+KEYS[key].replace('♭',' flat');
  // fetch the tool page (pinned on jsDelivr), write the key in, show it in a same-origin frame; a fresh load also stops whatever the last tool was playing
  const my=++ticket, f=$('frame'), id=tab; f.srcdoc='<body style="background:#000"></body>';
  const get=u=>fetch(u).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); });
  // jsDelivr first; GitHub's raw file server (same pinned commit) if jsDelivr refuses (it can, for big repos)
  (CACHE[id]||(CACHE[id]=get(BASE+id+'.html').catch(()=>get(RAW+id+'.html'))))
    .then(t=>{ if(my===ticket) f.srcdoc=t.split('new URLSearchParams(location.search).get("key")').join(String(key)); })
    .catch(()=>{ delete CACHE[id]; if(my===ticket) f.srcdoc='<body style="background:#000;color:#a69b8d;font:16px system-ui;text-align:center;padding:40px">This tool could not load. Check your connection and tap the tab again.</body>'; });
}
$('keys').addEventListener('click',e=>{ const b=e.target.closest('[data-key]'); if(!b) return; key=+b.dataset.key; store.set('key',key); showWork(); });
$('tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(!b||b.dataset.tab===tab) return; tab=b.dataset.tab; store.set('tab',tab); load(); });
$('changeBtn').addEventListener('click',showPick);

// the tool's own page sets the frame's height, so the page scrolls as one
let ro=null;
function fit(){ try{ const d=$('frame').contentDocument; if(!d||!d.body) return; const w=d.querySelector('.wrap')||d.body, h=Math.ceil(w.getBoundingClientRect().bottom+(d.defaultView.scrollY||0)+parseFloat(getComputedStyle(d.body).paddingBottom))+2; if(h>120) $('frame').style.height=h+'px'; }catch(e){} }
$('frame').addEventListener('load',()=>{
  if(ro) ro.disconnect();
  try{ const d=$('frame').contentDocument; d.documentElement.style.overflow='hidden'; ro=new ResizeObserver(fit); ro.observe(d.querySelector('.wrap')||d.body); fit(); }catch(e){}
});

key==null?showPick():showWork();
})();
/* ===== Space bar (CJ, Nov 22 2026): space starts / pauses / resumes the tool and NEVER scrolls the page.
   dguSpace({host, act, visible?})  host = the tool's outer element (code block div or iframe), act = what space does.
   One shared listener per window: with several tools on one page, space goes to the one last touched,
   else the one most on screen. Typing in a text box keeps a normal space. Shared file: /mnt/project-files/space-bar/space.js ===== */
function dguSpace(o){
  const W=window, R=W.__dguSpace||(W.__dguSpace={v:1,list:[],last:null});
  const me={host:o.host,act:o.act,vis:o.visible};
  R.list.push(me);
  o.host.addEventListener('pointerdown',()=>{ R.last=me; },true);
  if(R.on) return; R.on=1;
  const isSp=e=>(e.code==='Space'||e.key===' '||e.key==='Spacebar')&&!e.metaKey&&!e.ctrlKey&&!e.altKey;
  const typing=e=>{ const t=(e.composedPath&&e.composedPath()[0])||e.target; if(!t) return false;
    if(t.isContentEditable||t.tagName==='TEXTAREA') return true;
    return t.tagName==='INPUT'&&!/^(button|checkbox|radio|range|submit|reset|color|file|image)$/i.test(t.type||''); };
  const box=m=>{ const h=m.host; if(h.getBoundingClientRect().height) return h; // the code block's div can be display:contents on the site
    const sr=h.shadowRoot; return (sr&&(sr.querySelector('.wrap,.w')||sr.firstElementChild&&[...sr.children].find(e=>e.getBoundingClientRect().height)))||h; };
  const shown=m=>{ if(!m.host.isConnected||(m.vis&&!m.vis())) return 0; const r=box(m).getBoundingClientRect();
    const h=Math.min(r.bottom,W.innerHeight)-Math.max(r.top,0); return r.width>0&&r.height>0&&h>0?h:0; };
  R.pick=()=>{ if(R.last&&shown(R.last)) return R.last; let b=null,bh=0; R.list.forEach(m=>{ const h=shown(m); if(h>bh){ bh=h; b=m; } }); return b; };
  R.press=()=>{ const m=R.pick(); if(m) try{ m.act(); }catch(err){ console.warn('space',err); } };
  // capture on window: runs first, stops the page scroll, the focused button's own click and any older space handlers
  W.addEventListener('keydown',e=>{ if(!isSp(e)||typing(e)) return; e.preventDefault(); e.stopImmediatePropagation(); if(!e.repeat) R.press(); },true);
  W.addEventListener('keyup',e=>{ if(!isSp(e)||typing(e)) return; e.preventDefault(); e.stopImmediatePropagation(); },true);
  W.addEventListener('keypress',e=>{ if(!isSp(e)||typing(e)) return; e.preventDefault(); e.stopImmediatePropagation(); },true);
}
// press a button only when it's on screen and enabled; true if pressed
function dguTap(b){ if(!b||b.disabled||!b.getClientRects().length) return false; b.click(); return true; }
/* No footer, no empty space below the tool (CJ, Nov 22 2026): the site footer and any page sections below the tool never show,
   the section's bottom padding / spare grid rows are removed, and while running the credit line hides and the page scrolls
   so the tool sits right under the fixed site header. dguNoFooter(host, wrap, isRunning) */
function dguNoFooter(host,wrap,on){
  const d=document, de=d.documentElement;
  if(!d.getElementById('dgu-nofoot')){ const s=d.createElement('style'); s.id='dgu-nofoot';
    s.textContent='html[data-dgu-tool],html[data-dgu-tool] body,html[data-dgu-tool] #siteWrapper,html[data-dgu-tool] .site-wrapper,html[data-dgu-tool] main,html[data-dgu-tool] #page{background:#000!important}'+
      'html[data-dgu-tool] footer,html[data-dgu-tool] #footer-sections,html[data-dgu-tool] .dgu-below{display:none!important}'+
      'html[data-dgu-tool] .dgu-sec{min-height:0!important}html[data-dgu-tool] .dgu-sec .content-wrapper{padding-bottom:0!important}'+
      'html[data-dgu-tool] .dgu-sec .fluid-engine{grid-template-rows:none!important;grid-auto-rows:auto!important}';
    d.head.appendChild(s); }
  de.setAttribute('data-dgu-tool',''); host.style.setProperty('padding-bottom','12px','important');
  const sec=host.closest('section,.page-section');
  if(sec){ sec.classList.add('dgu-sec'); let n=sec.nextElementSibling; while(n){ n.classList.add('dgu-below'); n=n.nextElementSibling; } }
  const sr=host.shadowRoot; let was=null;
  const headerBottom=()=>{ const h=d.querySelector('header,#header'); if(!h) return 0; const p=getComputedStyle(h).position; if(p!=='fixed'&&p!=='sticky') return 0; return Math.max(0,h.getBoundingClientRect().bottom); };
  // while running, pull the tool's section up so nothing empty sits above it: at the top of the page the tool
  // is right under the header and you can't scroll up into blank space (CJ Nov 22, Steps Drill)
  const lift=sec||host; let lifted=0;
  const headerDocBottom=()=>{ const h=d.querySelector('header,#header'); if(!h) return 0; const p=getComputedStyle(h).position, b=h.getBoundingClientRect().bottom;
    return Math.max(0,(p==='fixed'||p==='sticky')?b:b+window.scrollY); };
  const fit=()=>{ const t=wrap.getBoundingClientRect().top+window.scrollY, want=headerDocBottom()+8;
    lifted=Math.min(0,lifted-(t-want)); lift.style.setProperty('margin-top',lifted+'px','important'); window.scrollTo(0,0); };
  const sync=()=>{ const r=!!on(); if(r===was) return; was=r;
    if(sr) sr.querySelectorAll('.credit').forEach(c=>{ c.style.display=r?'none':''; });
    if(r) requestAnimationFrame(fit); else { lifted=0; lift.style.removeProperty('margin-top'); } };
  window.addEventListener('resize',()=>{ if(was) requestAnimationFrame(fit); });
  new MutationObserver(sync).observe(wrap,{attributes:true,attributeFilter:['class']}); sync();
}
  /* Space bar + no footer (CJ Nov 22, shared code in /mnt/project-files/space-bar/). The tool in the frame registers its own
     Space action; this forwards Space to it when the page (not the frame) has the keyboard, and hides the site footer while it runs. */
  var fr = root.getElementById('frame');
  dguSpace({host: fr, act: function(){ try { var R = fr.contentWindow.__dguSpace; if (R && R.press) R.press(); } catch (e) {} }});
  dguNoFooter(host, host, function(){ return host.classList.contains('kw-run'); });
  setInterval(function(){ var r = !!((function(){ try { var d = fr.contentDocument; if (!d) return false; if (d.querySelector('.ss-play')) return true; var a = d.querySelectorAll('*'); for (var i = 0; i < a.length; i++) if (a[i].shadowRoot && a[i].shadowRoot.querySelector('.ss-play')) return true; } catch (e) {} return false; })()); if (host.classList.contains('kw-run') !== r) host.classList.toggle('kw-run', r); }, 400);

})();
</script>
