<!-- Don't Give Up Dojo: Key Workout (one key, a tab per tool). Paste this whole block into a Squarespace Code Block (Display Source off). Tools: jamesrobbins43/dojo-audio@d8cb0df key-workout/tools/ -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Figtree:wght@400;500;600&display=swap">
<div id="dgu-key-workout-page" style="background:#000"></div>
<script>
(function(){
  var host = document.getElementById('dgu-key-workout-page');
  if (!host || host.shadowRoot) return;
  var sec = host.closest('section');
  if (sec) { sec.style.background = '#000'; var sb = sec.querySelector('.section-background'); if (sb) { sb.style.background = '#000'; sb.innerHTML = ''; } }
  var root = host.attachShadow({mode:'open'});
  root.innerHTML = '<style>' + "\n/* Key Workout (Dojo page, CJ Nov 17): pick ONE major key, then a tab per tool; every tool only gives problems in that key */\n:host{\n  color-scheme:dark;\n  --bg:#000000; --surface:#181410; --fg:#f1ebe2; --muted:#a69b8d; --line:#2e2822;\n  --brand:#18CEFB; --accent:#e09a3e; --tabline:#4a4038; --accent-ink:#1a120a; --gold:#f2b25c;\n  --body:\"Outfit\",\"Figtree\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n}\n/* the Dojo tools are always on pure black, so the page stays dark in both themes */\n@media (prefers-color-scheme: light){ :host:not([data-theme=\"dark\"]){ --bg:#000000; } }\n:host[data-theme=\"dark\"]{ --bg:#000000; }\n*{box-sizing:border-box}\n[hidden]{display:none!important}\n:host{display:block;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 32px}\n.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}\nh1{font-family:\"Outfit\",var(--body);font-weight:700;font-size:clamp(40px,5vw,60px);line-height:1;margin:0;letter-spacing:.01em}\nbutton{font:inherit;cursor:pointer}\nbutton:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.kacc{font-size:.62em;font-weight:400;vertical-align:.5em;margin-left:.04em}\n\n/* Pick a key */\n.pick{display:flex;flex-direction:column;gap:12px;max-width:780px;width:100%}\n.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}\n.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.keys button{border:0;background:var(--bg);color:var(--fg);font-family:\"Outfit\",var(--body);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1;padding:22px 0;min-width:0}\n.keys button:hover{background:var(--surface);color:var(--gold)}\n.keys button[aria-pressed=\"true\"]{background:var(--accent);color:var(--accent-ink)}\n\n/* Workout */\n.head{display:flex;align-items:baseline;gap:14px 22px;flex-wrap:wrap}\n.keyname{margin-left:clamp(10px,2vw,22px);font-family:\"Outfit\",var(--body);font-weight:700;font-size:clamp(40px,5vw,60px);line-height:1;color:var(--gold)}\n.keyname .of{color:var(--muted);font-weight:500}\n.change{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 14px;font-weight:600;font-size:15px;align-self:center}\n.change:hover{border-color:var(--accent)}\n.tabs{display:flex;flex-wrap:wrap;padding-left:1px}   /* the tabs always fill the full width; on narrow screens they wrap onto more rows (CJ Nov 17) */\n.tabs button{flex:1 0 auto;border:1px solid var(--tabline);margin:0 0 -1px -1px;background:#0d0b09;color:var(--muted);font-weight:600;font-size:17px;padding:10px 18px;white-space:nowrap}\n.tabs button:first-child{border-top-left-radius:10px}\n.tabs button:last-child{border-top-right-radius:10px}\n.tabs button:hover{color:var(--fg)}\n.tabs button[aria-selected=\"true\"]{color:var(--fg);background:var(--bg);border-bottom-color:var(--bg);box-shadow:inset 0 3px 0 var(--accent)}\n.panel{border:1px solid var(--tabline);border-top:0;border-radius:0 0 12px 12px;padding:6px 14px 4px}\n.frame{display:block;width:100%;border:0;background:var(--bg);height:900px}\n.credit{font-size:12px;color:#6f665b}\n@media (max-width:1000px){ .tabs button{font-size:15px;padding:9px 10px} }\n@media (max-width:520px){\n  .tabs button{font-size:15px;padding:9px 12px;border-radius:0!important}\n  .panel{padding:4px 8px 2px}\n}\n\nh1,p{margin:0}\n.kwerr{color:var(--muted);padding:40px 0;text-align:center}\n" + '</style>' + "<div class=\"wrap\">\n  <header class=\"head\">\n    <h1>Key Workout</h1>\n    <div class=\"keyname\" id=\"keyName\" hidden></div>\n    <button class=\"change\" id=\"changeBtn\" type=\"button\" hidden>Change key</button>\n  </header>\n\n  <section class=\"pick\" id=\"pick\" aria-label=\"Pick a major key\">\n    <div class=\"lab\">Major key</div>\n    <div class=\"keys\" id=\"keys\" role=\"group\" aria-label=\"Major keys\"></div>\n  </section>\n\n  <section id=\"work\" hidden>\n    <div class=\"tabs\" id=\"tabs\" role=\"tablist\" aria-label=\"Tools\"></div>\n    <div class=\"panel\"><iframe class=\"frame\" id=\"frame\" title=\"Tool\" allow=\"microphone; autoplay\"></iframe></div>\n  </section>\n\n  <p class=\"credit\">Guitar sounds: tonejs-instruments by nbrosowsky, CC BY 3.0.</p>\n</div>";
  (() => {
const BASE='https://cdn.jsdelivr.net/gh/jamesrobbins43/dojo-audio@d8cb0dfe05642e493e302bd9c089e3ac7dc1eef7/key-workout/tools/', RAW='https://raw.githubusercontent.com/jamesrobbins43/dojo-audio/d8cb0dfe05642e493e302bd9c089e3ac7dc1eef7/key-workout/tools/', CACHE={}; let ticket=0;
const KEYS=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const TOOLS=[
  ['steps-drill','Steps Drill'],
  ['find-the-note','Find the Note'],
  ['find-the-chord','Find the Chord'],
  ['chord-trainer','Chord Trainer'],
  ['find-the-key','Find the Number'],
  ['numbers-play-along','Numbers Play Along'],
];
const $=id=>root.getElementById(id);
const store={ get(k,d){ try{ const v=localStorage.getItem('dgkp:'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
              set(k,v){ try{ localStorage.setItem('dgkp:'+k,JSON.stringify(v)); }catch(e){} } };
const keyHTML=n=>n[0]+(n[1]?`<span class="kacc">${n[1]}</span>`:'');
let key=store.get('key',null), tab=store.get('tab',TOOLS[0][0]);
if(!(key>=0&&key<12)) key=null;
if(!TOOLS.some(t=>t[0]===tab)) tab=TOOLS[0][0];

$('keys').innerHTML=KEYS.map((n,k)=>`<button type="button" data-key="${k}" aria-pressed="false" aria-label="${n.replace('♭',' flat')} major">${keyHTML(n)}</button>`).join('');
$('tabs').innerHTML=TOOLS.map(([id,t])=>`<button type="button" role="tab" data-tab="${id}" aria-selected="false">${t}</button>`).join('');

function showPick(){
  $('pick').hidden=false; $('work').hidden=true; $('keyName').hidden=true; $('changeBtn').hidden=true;
  ticket++; $('frame').srcdoc='';
  root.querySelectorAll('#keys button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.key===key)));
}
function showWork(){
  $('pick').hidden=true; $('work').hidden=false; $('keyName').hidden=false; $('changeBtn').hidden=false;
  $('keyName').innerHTML=keyHTML(KEYS[key]);
  load();
}
function load(){
  root.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  const t=TOOLS.find(x=>x[0]===tab);
  $('frame').title=t[1]+', key of '+KEYS[key].replace('♭',' flat');
  // fetch the tool page (pinned on jsDelivr), write the key in, show it in a same-origin frame; a fresh load also stops whatever the last tool was playing
  const my=++ticket, f=$('frame'), id=tab; f.srcdoc='<body style="background:#000"></body>';
  const get=u=>fetch(u).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); });
  // jsDelivr first; GitHub's raw file server (same pinned commit) if jsDelivr refuses (it can, for big repos)
  (CACHE[id]||(CACHE[id]=get(BASE+id+'.html').catch(()=>get(RAW+id+'.html'))))
    .then(t=>{ if(my===ticket) f.srcdoc=t.split('new URLSearchParams(location.search).get("key")').join(String(key)); })
    .catch(()=>{ delete CACHE[id]; if(my===ticket) f.srcdoc='<body style="background:#000;color:#a69b8d;font:16px system-ui;text-align:center;padding:40px">This tool could not load. Check your connection and tap the tab again.</body>'; });
}
$('keys').addEventListener('click',e=>{ const b=e.target.closest('[data-key]'); if(!b) return; key=+b.dataset.key; store.set('key',key); showWork(); });
$('tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(!b||b.dataset.tab===tab) return; tab=b.dataset.tab; store.set('tab',tab); load(); });
$('changeBtn').addEventListener('click',showPick);

// the tool's own page sets the frame's height, so the page scrolls as one
let ro=null;
function fit(){ try{ const d=$('frame').contentDocument; if(!d||!d.body) return; const w=d.querySelector('.wrap')||d.body, h=Math.ceil(w.getBoundingClientRect().bottom+(d.defaultView.scrollY||0)+parseFloat(getComputedStyle(d.body).paddingBottom))+2; if(h>120) $('frame').style.height=h+'px'; }catch(e){} }
$('frame').addEventListener('load',()=>{
  if(ro) ro.disconnect();
  try{ const d=$('frame').contentDocument; d.documentElement.style.overflow='hidden'; ro=new ResizeObserver(fit); ro.observe(d.querySelector('.wrap')||d.body); fit(); }catch(e){}
});

key==null?showPick():showWork();
})();
})();
</script>
