    return ch;
  });
}
PARTS.forEach(p=>{
  p.progs.forEach(pr=>pr.bars=parseProg(pr.s));
  const F=p.flash; F.list=F.cards.map((n,i)=>({n, q: i? F.hits[i-1]+1.3 : 0, a: F.hits[i]}));
});

/* ---------- Labels ---------- */
function lab(s){ // "2m" "7\xb0" "1/3" "F#\xb0" "D/F#" -> HTML
  const one=x=>x.replace(/m$/,'<span class="m">m</span>').replace(/#/g,'<span class="acc">\u266f</span>').replace(/^([A-G])b/,'$1<span class="acc fl">\u266d</span>').replace(/\xb0/g,'<span class="dg" aria-label="diminished"></span>');
  const [top,bass]=s.split('/');
  return '<span class="ch'+(/^\d/.test(top)?' num':'')+'">'+one(top)+(bass!=null?'<span class="sl">/</span><span class="bs">'+one(bass)+'</span>':'')+'</span>';
}
const ARROW='<svg viewBox="0 0 96 32" aria-hidden="true"><path d="M4 18c18-3 46-4 80-3" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M66 5c7 4 13 7 20 10-7 3-14 7-21 12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function diamondSVG(n){ return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4L96 50L50 96L4 50Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><foreignObject x="10" y="22" width="80" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 40px/56px Outfit,system-ui,sans-serif;text-align:center;color:#f1ebe2">${lab(n)}</div></foreignObject></svg>`; }
const say=n=>LETTER[n].replace(/^([A-G])b/,'$1 flat').replace(/\/([A-G])b/,'/$1 flat').replace('#',' sharp').replace('\xb0',' diminished').replace('/',' over ');

const $ = id => root.getElementById(id);
const store = {
  get(k,d){ try{ const v=localStorage.getItem('dgnp:'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('dgnp:'+k, JSON.stringify(v)); }catch(e){} }
};
// CJ Nov 17: no Number drill tab; a box (checked by default) puts the Number drill before the play along
const settings=Object.assign({part:0, drill:true, prog:-1, names:true, sound:true, key:DEFAULT_KEY}, store.get('settings',{}));
if(!KEY_ORDER.includes(settings.key)) settings.key=DEFAULT_KEY;
setKey(settings.key);
if(!PARTS[settings.part]) settings.part=0;
settings.mode=settings.drill===false?'play':'both';
const save=()=>store.set('settings',settings);

/* ---------- Setup ---------- */
function renderSetup(){
  $('key').innerHTML=KEY_ORDER.map(k=>`<option value="${k}">${keyName(k)}</option>`).join('');
  $('key').value=settings.key;
  $('parts').innerHTML=PARTS.map((p,i)=>`<button type="button" data-part="${i}" aria-pressed="${i===settings.part}">${p.label.replace(/m\b/,'<span class="m">m</span>')}</button>`).join('');
  $('drill').checked=settings.drill!==false;
  const P=PARTS[settings.part];
  if(settings.prog>=P.progs.length) settings.prog=-1;
  const progName=pr=>pr.bars.map(b=>b.map(c=>c.n).join(' ')).join(' | ')+'  \xb7  '+pr.bpm+' BPM';
  $('prog').innerHTML=(P.progs.length>1?`<option value="-1">All ${P.progs.length} progressions</option>`:'')+P.progs.map((pr,i)=>`<option value="${i}">${progName(pr)}</option>`).join('');
  if(P.progs.length===1) settings.prog=0;
  $('prog').value=String(settings.prog);
  $('names').checked=settings.names;
}
$('parts').addEventListener('click',e=>{ const b=e.target.closest('[data-part]'); if(!b) return; settings.part=+b.dataset.part; settings.prog=-1; save(); renderSetup(); stop(); });
$('drill').addEventListener('change',e=>{ settings.drill=e.target.checked; settings.mode=settings.drill?'both':'play'; save(); stop(); });
$('key').addEventListener('change',e=>{ settings.key=e.target.value; save(); setKey(settings.key); $('chart').innerHTML=chartHTML(); stop(); });
$('prog').addEventListener('change',e=>{ settings.prog=+e.target.value; save(); stop(); });
$('names').addEventListener('change',e=>{ settings.names=e.target.checked; save(); stop(); });

/* ---------- Sound: CJ's own audio from the video ---------- */
let ctx=null, master=null;
function audio(){
  if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=settings.sound?1:0; master.connect(ctx.destination); }catch(e){ ctx=null; } }
  if(ctx&&ctx.state==='suspended') ctx.resume();
  return ctx;
}
const clips={}, ready={};
function loadClip(clip){
  const name=keyId(settings.key)+'/'+clip;   // cache per key
  if(clips[name]) return clips[name];
  const p=fetch(AUDIO_BASE.replace('{key}',keyId(settings.key))+clip+'.mp4').then(r=>{ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(ab=>new Promise((res,rej)=>ctx.decodeAudioData(ab,res,rej)))
    .then(buf=>{ ready[name]=buf; return buf; });
  p.catch(()=>{ delete clips[name]; });
  return clips[name]=p;
}

/* ---------- Session timeline ---------- */
function build(){
  const P=PARTS[settings.part], items=[];
  const progs = settings.prog<0 ? P.progs : [P.progs[settings.prog]];
  const add=it=>{ const last=items[items.length-1]; it.start= last? last.start+last.dur+.5 : 0; items.push(it); };
  const plays=[], playItem=pr=>({type:'play', pr, clip:pr.clip, beat:60/pr.bpm, dur:pr.dur});
  if(settings.mode!=='flash'){ progs.forEach(pr=>plays.push(playItem(pr))); }
  if(settings.mode==='play'){ plays.forEach(add); }
  else {
    // in the video the 1 4 1 4 demo comes before the first flash cards
    // the Number drill always comes first when it's on (CJ Nov 17), even in 1 4 5 where the video plays the 1 4 1 4 demo first
    add({type:'flash', F:P.flash, clip:P.flash.clip, dur:P.flash.dur});
    if(settings.mode==='both') plays.forEach(add);
  }
  const np=items.filter(x=>x.type==='play').length; let k=0;
  items.forEach(it=>{ if(it.type==='play'){ it.i=k++; it.of=np; } });
  return {items, total: items.length? items[items.length-1].start+items[items.length-1].dur : 0};
}

/* ---------- Clock (the audio clock) and clip playback ---------- */
let S=null, firstDiamond=true;
const clock=()=> ctx? ctx.currentTime : performance.now()/1000;
function pos(){ return S.paused||S.waiting? S.pos0 : S.pos0+(clock()-S.c0); }
function stopSources(){ if(!S) return; for(const k in S.srcs){ try{ S.srcs[k].stop(); }catch(e){} } S.srcs={}; }
function seek(p){ stopSources(); S.pos0=Math.max(0,p); S.c0=clock(); }
function tick(){
  if(!S||S.paused||S.over||!ctx) return;
  let p=pos();
  S.items.forEach((it,idx)=>{
    if(S.srcs[idx] || it.start>p+.25 || p>=it.start+it.dur-.05) return;
    const buf=ready[keyId(settings.key)+'/'+it.clip];
    if(!buf){ // hold the clock at the start of a clip that is still loading
      if(p>=it.start){ S.pos0=it.start; S.c0=clock(); S.waiting=true; loadClip(it.clip).then(()=>{ if(S&&S.waiting){ S.waiting=false; S.c0=clock(); } }).catch(()=>failed()); }
      return;
    }
    const src=ctx.createBufferSource(); src.buffer=buf; src.connect(master);
    if(it.start>p){ src.start(S.c0+(it.start-S.pos0)); }
    else { src.start(ctx.currentTime, p-it.start); }
    S.srcs[idx]=src;
  });
}
setInterval(tick,25);

/* ---------- Drawing ---------- */
function chartHTML(){ return CHART.map(([n])=>`<div class="n">${lab(n)}</div>`).join('')+CHART.map(([,c])=>`<div class="c">${lab(c)}</div>`).join(''); }
$('chart').innerHTML=chartHTML();
let lastKey='';
function setStatus(txt){ const s=$('status'); if(txt){ s.textContent=txt; s.classList.remove('off'); } else s.classList.add('off'); }
function setProgress(kind,i,of){ $('progress').innerHTML= kind? `<b>${i} <span class="of">of</span> ${of}</b><span>${kind}</span>` : ''; }
function setBar(f){ $('timerBar').style.width=(Math.max(0,Math.min(1,f))*100).toFixed(2)+'%'; }
function current(p){ let c=0; S.items.forEach((x,i)=>{ if(x.start<=p) c=i; }); return c; }

function draw(){
  requestAnimationFrame(draw);
  if(!S||S.over||S.loading) return;
  const p=pos();
  if(p>=S.total) return finish();
  S.cur=current(p);
  const it=S.items[S.cur], q=p-it.start;
  if(q>=it.dur){ setBar(1); return; } // short gap between clips
  if(it.type==='flash') return drawFlash(it,q);
  return drawPlay(it,q);
}
function cardAt(F,q){ let c=0; F.list.forEach((x,i)=>{ if(x.q<=q) c=i; }); return c; }
function drawFlash(it,q){
  const F=it.F, ci=cardAt(F,q), card=F.list[ci], shown=q>=card.a;
  setBar(shown?1:(q-card.q)/(card.a-card.q));
  const key=`f${S.cur}|${ci}|${shown}`;
  if(key===lastKey) return; lastKey=key;
  setProgress('Number drill',ci+1,F.list.length);
  $('chart').classList.toggle('off',ci>=F.keyOff);
  setStatus(ci===F.keyOff-1?'Removing key':'');
  const caps=ci===0;
  $('main').innerHTML=`<div class="flash"><div class="q">${lab(card.n)}</div><div class="arrow">${ARROW}</div><div class="a${shown?'':' off'}">${lab(LETTER[card.n])}</div>${caps?'<div class="cap">Play this chord</div><div></div><div class="cap">Before it appears here</div>':''}</div>`;
  $('countin').innerHTML='';
  if(shown) $('live').textContent=`${card.n} is ${say(card.n)}`;
}
function drawPlay(it,qt){
  const pr=it.pr, B=it.beat, q=Math.max(0,qt-PLAY_OFFSET), beatN=Math.floor(q/B), bar=Math.floor(beatN/4), bib=beatN%4;
  setBar(qt/it.dur);
  const lastBar=17;
  const pass=bar>=1&&bar<lastBar?Math.floor((bar-1)/4):(bar<1?-1:4);
  const slot=bar>=1&&bar<lastBar?(bar-1)%4:-1;
  const key=`p${S.cur}|${Math.min(bar,lastBar)}|${bar>=lastBar?0:bib}`;
  if(key===lastKey) return; lastKey=key;
  setProgress('Play along',it.i+1,it.of);
  const keyOn = !pr.noKey && !(pr.keyOff && bar>=pr.keyOff);
  const countOn = !(pr.countOff && bar>=pr.countOff);
  $('chart').classList.toggle('off',!keyOn);
  setStatus((pr.msgs&&pr.msgs[bar]) || (pr.keyOff&&(bar===pr.keyOff-2||bar===pr.keyOff-1)?'Removing key':''));
  if(bar>=lastBar){ // diamond: strum once, let it ring for the bar
    const cap=firstDiamond?'<div class="cap">Strum once and let it ring out for a measure</div>':'';
    $('main').innerHTML=`<div class="slots"><div class="slot" style="grid-column:1 / span 4"><div class="diamond">${diamondSVG(pr.dia)}${cap}</div></div></div>`;
    $('countin').innerHTML=''; $('live').textContent='Strum once and let it ring';
    return;
  }
  const names=settings.names&&!pr.numbers;
  const label=(c,si)=>{
    if(!names) return c.n;
    if(pass<=0) return LETTER[c.n];
    if(pass===1) return (slot*4+bib >= si*4+c.at+2) ? c.n : LETTER[c.n]; // the name turns into its number 2 beats after the chord is played
    return c.n;
  };
  const slots=pr.bars.map((b,si)=>{
    const split=b.length>1, uneven=split&&b.some(c=>c.b!==b[0].b);
    const cw=c=>`<span class="cw${split&&c.at+c.b===4&&c.b===1?' end':''}" style="${split?`grid-column:${c.at+1} / span ${c.b}`:''}"><span class="hm">${uneven?'|'.repeat(c.b):''}</span>${lab(label(c,si))}</span>`;
    const cnt=(si===slot&&countOn)?`<span style="left:${((bib+.5)/4*100).toFixed(1)}%">${bib+1}</span>`:'';
    return `<div class="slot${split?' split':''}"><div class="row${split?'':' one'}">${b.map(cw).join('')}</div><div class="cnt">${cnt}</div></div>`;
  }).join('');
  $('main').innerHTML=`<div class="slots${pr.bars.every(b=>b.length===1)?' narrow':''}">${slots}</div>`;
  unclash();
  if(slot>=0&&countOn) placeCount(slot,pr.bars[slot],bib);
  $('countin').innerHTML= bar===0 ? `<div class="big">${bib+1}</div><div class="meter">4/4<b>${pr.bpm} <small>BPM</small></b></div>` : '';
  if(bar===0&&bib===0) $('live').textContent=`Count in, ${pr.bpm} beats per minute`;
}
// beat counter walks across the bar; the beat a chord lands on sits centered under that chord, beats in between are spaced evenly
// long names (G\u266D/B\u266D then C\u266D) can run into the next chord in a 2-chord bar: nudge the next one right just enough
function unclash(){
  $('main').querySelectorAll('.slot.split .row').forEach(row=>{
    const cws=[...row.querySelectorAll('.cw')], gap=parseFloat(getComputedStyle(row).fontSize)*.3;
    for(let i=1;i<cws.length;i++){
      if(cws[i].classList.contains('end')) continue;
      const a=cws[i-1].querySelector('.ch').getBoundingClientRect(), b=cws[i].querySelector('.ch').getBoundingClientRect();
      const need=a.right+gap-b.left; if(need>0) cws[i].style.marginLeft=need.toFixed(1)+'px';
    }
  });
}
function placeCount(si,bar,bib){
  const el=$('main').querySelectorAll('.slot')[si]; if(!el) return;
  const sp=el.querySelector('.cnt span'); if(!sp) return;
  const W=el.clientWidth, r0=el.getBoundingClientRect().left, hw=sp.offsetWidth/2;
  const cs=[...el.querySelectorAll('.cw .ch')].map(ch=>{ const r=ch.getBoundingClientRect(); return r.left-r0+r.width/2; });
  if(!W||cs.length!==bar.length) return;
  const k=Math.max(0,bar.findIndex(c=>bib>=c.at&&bib<c.at+c.b)), c=bar[k];
  let x;
  if(bib===c.at) x=cs[k];
  else if(k+1<cs.length) x=cs[k]+(cs[k+1]-cs[k])*(bib-c.at)/c.b;
  else x=Math.min(W-hw, Math.max(cs[k]+(bib-c.at)*hw*3, (bib+.5)/4*W));
  sp.style.left=x.toFixed(1)+'px';
}
requestAnimationFrame(draw);

/* ---------- Controls ---------- */
function idleView(state){
  lastKey='';
  setProgress('');
  $('chart').classList.remove('off'); setStatus('');
  $('main').innerHTML= state==='done'? '<div class="msg brand">Nice work</div>'
    : state==='loading'? '<div class="msg">Loading</div>'
    : state==='error'? '<div class="msg">No sound</div><p class="msg-sub">The audio didn\u2019t load. Check your connection and press Start again.</p>'
    : '';
  $('countin').innerHTML=''; setBar(0);
  $('nextBtn').textContent= state==='done'?'Go again':'Start'; $('pauseBtn').textContent='Pause';
  $('nextBtn').disabled= state==='loading';
  $('pauseBtn').disabled=true; $('backBtn').disabled=true;
  if(state) demoStop(); else drawExample();
}
// start screen (CJ, Nov 17): a Number drill card, then a play-along line, loop until Start, in DGU blue, no sound;
// each step gets a black box with an arrow pointing at it
let demoT=null, demoTick=null;
// demo callout: put one blue bubble next to el (above it, or below with below=true), its pointer aimed at el's centre
function coach(host,el,text,below){
  let c=host.querySelector(':scope > .coach');
  if(!el){ if(c) c.classList.remove('on'); return; }
  if(!c){ c=host.ownerDocument.createElement('div'); c.className='coach'; c.setAttribute('aria-live','polite'); host.appendChild(c); }
  c.classList.remove('on'); c.textContent=text; c.classList.toggle('below',!!below);
  const hr=host.getBoundingClientRect(), r=el.getBoundingClientRect(), cw=c.offsetWidth, chh=c.offsetHeight;
  const cx=r.left+r.width/2-hr.left, left=Math.max(4,Math.min(hr.width-cw-4,cx-cw/2));
  c.style.left=left+'px'; c.style.top=(below? r.bottom-hr.top+48 : r.top-hr.top-chh-48)+'px';
  c.style.setProperty('--px',Math.max(14,Math.min(cw-14,cx-left))+'px');
  void c.offsetWidth; c.classList.add('on');
}
function demoStop(){ clearTimeout(demoT); clearInterval(demoTick); demoT=demoTick=null; $('card').parentNode.classList.remove('demo'); coach($('card').closest('.wrap'),null); $('chart').classList.remove('off'); const b=$('timerBar'); b.style.transition=''; }
function demoBar(ms){ const b=$('timerBar'); b.style.transition='none'; b.style.width='0%'; void b.offsetWidth; if(ms){ b.style.transition=`width ${ms}ms linear`; b.style.width='100%'; } else b.style.width='100%'; }
function drawExample(i=0,step=-1){
  clearTimeout(demoT);
  const host=$('card').closest('.wrap'), next=(ms,a,b)=>{ demoT=setTimeout(()=>drawExample(a,b),ms); };
  if(i>=4){ clearInterval(demoTick); demoTick=null; coach(host,$('nextBtn'),'Press Start when you are ready.'); demoT=setTimeout(()=>coach(host,null),6000); return; } // plays through twice, then stops (CJ)
  $('card').parentNode.classList.add('demo');
  $('progress').innerHTML='<span class="tag">Example</span>';
  if(i%2===0){ // Number drill
    clearInterval(demoTick); demoTick=null; { const c=$('chart'); if(c.classList.contains('off')){ c.style.transition='none'; c.classList.remove('off'); void c.offsetWidth; c.style.transition=''; } }
    $('main').innerHTML=`<div class="flash"><div class="q">${lab('4')}</div><div class="arrow">${ARROW}</div><div class="a${step>0?'':' off'}">${lab(LETTER['4'])}</div></div>`;
    if(step===-1){ demoBar(0); $('timerBar').style.width='0%'; coach(host,$('setup'),'First pick your settings: the key, which numbers to practice, whether to start with the Number drill, and which play-along.',true); next(6500,i,0); }
    else if(step===0){ demoBar(5500); coach(host,$('main').querySelector('.q'),'Number drill: play the chord for this number before its name shows.',true); next(5500,i,1); }
    else { demoBar(0); coach(host,$('main').querySelector('.a'),`Then the name shows, so you can check: 4 is ${LETTER['4']} in this key.`,true); next(6000,i+1,0); }
    return;
  }
  // play along: one bar per chord, the small beat number walks 1 2 3 4
  if(step<=0){
    $('chart').classList.remove('off');
    $('main').innerHTML='<div class="slots narrow">'+['1','4','5','4'].map(n=>`<div class="slot"><div class="row one"><span class="cw"><span class="hm"></span>${lab(n)}</span></div><div class="cnt"></div></div>`).join('')+'</div>';
    let k=0; const tick=()=>{ const sl=$('main').querySelectorAll('.slot'); sl.forEach(x=>x.querySelector('.cnt').innerHTML=''); const si=Math.floor(k/4)%4, bib=k%4; sl[si].querySelector('.cnt').innerHTML=`<span>${bib+1}</span>`; placeCount(si,[{n:'',at:0,b:4}],bib); k++; };
    clearInterval(demoTick); tick(); demoTick=setInterval(tick,850);
    demoBar(17500); coach(host,$('main').querySelector('.slot .cw'),'Play along: strum each chord with the band, one bar each.',true); next(5500,i,1);
  }else if(step===1){ coach(host,$('main').querySelector('.cnt span'),'This small number counts the beats: 1, 2, 3, 4.',true); next(5500,i,2); }
  else { coach(host,$('chart'),'Bit by bit the names, the key and the count go away, until you play from the numbers alone.',true); $('chart').classList.add('off'); next(6500,i+1,-1); }
}
async function start(){
  if(!audio()) return idleView('error');
  const T=build(); if(!T.items.length) return;
  const run=S=Object.assign(T,{paused:false, over:false, loading:true, waiting:false, pos0:0, c0:0, cur:0, srcs:{}});
  idleView('loading');
  const first=loadClip(T.items[0].clip);
  T.items.slice(1).forEach(it=>loadClip(it.clip).catch(()=>{}));
  try{ await first; }catch(e){ if(S===run){ S=null; idleView('error'); } return; }
  if(S!==run) return;
  if(ctx.state==='suspended') await Promise.race([ctx.resume(), new Promise(r=>setTimeout(r,400))]).catch(()=>{}); // never hang here if the browser holds audio back
  firstDiamond=true; lastKey='';
  S.loading=false; S.pos0=0; S.c0=clock()+.12;
  $('nextBtn').disabled=false; $('nextBtn').textContent='Skip'; $('pauseBtn').disabled=false; $('backBtn').disabled=false; $('pauseBtn').textContent='Pause';
}
function failed(){ if(!S) return; S.over=true; stopSources(); S=null; idleView('error'); }
function stop(){ if(S){ S.over=true; stopSources(); S=null; } idleView(); }
function finish(){ if(!S) return; S.over=true; stopSources(); idleView('done'); }
function jump(p){ lastKey=''; S.waiting=false; seek(p); }
function skip(){
  if(!S||S.loading) return;
  const p=pos(), it=S.items[S.cur];
  if(it.type==='flash'){ const ci=cardAt(it.F,p-it.start), nx=it.F.list[ci+1]; if(nx) return jump(it.start+nx.q); }
  else firstDiamond=false;
  const nx=S.items[S.cur+1]; if(!nx) return finish();
  jump(nx.start);
}
function back(){
  if(!S||S.loading) return;
  const p=pos(), it=S.items[S.cur], q=p-it.start;
  if(it.type==='flash'){ const ci=cardAt(it.F,q), c=it.F.list[ci]; if(q-c.q<1.5&&ci>0) return jump(it.start+it.F.list[ci-1].q); if(ci>0||q>=1.5) return jump(it.start+c.q); }
  else if(q>=1.5||S.cur===0) return jump(it.start);
  const pv=S.items[S.cur-1]; jump(pv? pv.start : 0);
}
function togglePause(){
  if(!S||S.over||S.loading) return;
  if(!S.paused){ S.pos0=pos(); S.paused=true; stopSources(); $('pauseBtn').textContent='Resume'; }
  else { audio(); S.paused=false; seek(S.pos0); $('pauseBtn').textContent='Pause'; }
}
// remember that the first diamond's caption has been shown
setInterval(()=>{ if(S&&!S.over&&!S.loading){ const it=S.items[S.cur]; if(it&&it.type==='play'&&pos()>it.start+it.dur) firstDiamond=false; } },200);
$('nextBtn').onclick=()=>{ if(!S||S.over) start(); else skip(); };
$('pauseBtn').onclick=togglePause; $('backBtn').onclick=back;
function syncMute(){ const b=$('muteBtn'); b.textContent=settings.sound?'Sound off':'Sound on'; b.setAttribute('aria-pressed',String(!settings.sound)); if(master) master.gain.value=settings.sound?1:0; }
$('muteBtn').onclick=()=>{ settings.sound=!settings.sound; save(); syncMute(); };

// space bar: pause / resume (starts when nothing is playing). Ignored while typing or choosing in a dropdown.
document.addEventListener('keydown',e=>{
  if(e.code!=='Space'&&e.key!==' ') return;
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey) return;
  const t=(e.composedPath&&e.composedPath()[0])||e.target;
  if(t&&(/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)||t.isContentEditable)) return;
  e.preventDefault();
  if(!S||S.over) start(); else togglePause();
});
renderSetup(); syncMute(); idleView();
})();
})();
</script>
