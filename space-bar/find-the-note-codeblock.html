/* Settings on one line (CJ) */
.optbreak{display:none}
.optbar{gap:12px 22px;padding:14px 16px;justify-content:space-between}
.opt{gap:8px}
.opt.rng input{width:96px}
.pill{padding:8px 11px}
/* Record mode (scoring) */
.mode{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.mode button{border:0;background:transparent;color:var(--muted);font:600 15px/1 var(--body);padding:10px 18px}
.mode button+button{border-left:1px solid var(--line)}
.mode button.on{background:var(--accent);color:var(--accent-ink)}
.mode button[data-m=rec].on{background:#4a0d0d;color:#fff}
.rp{display:none;align-items:center;gap:8px 12px;flex-wrap:wrap;border:2px solid var(--brand);border-radius:10px;padding:8px 12px;background:rgba(24,206,251,.07)}
.rp.ok{border:1px solid var(--line);background:transparent}
.rstep{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--brand);white-space:nowrap}
.rstep b{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#000;font-size:14px}
.rp.ok .rstep{color:#3ccf6e}
.rp.ok .rstep b{background:#3ccf6e}
.w-rec .rp{display:flex}
.rp .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.rp .f span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rp select{max-width:280px}
.meter{flex:1;min-width:120px;height:8px;border-radius:99px;background:#1c1915;overflow:hidden}
.meter b{display:block;height:100%;width:0;background:#3ccf6e;border-radius:99px}
.meter b.hot{background:#ff5c5c}
.rinfo{flex-basis:100%;font-size:14px;color:var(--fg);line-height:1.35}
.rinfo:empty{display:none}
.btn.recgo{background:#ff5c5c;border-color:#ff5c5c;color:#fff;min-width:120px}
.rmon{display:none;position:absolute;top:16px;right:24px;width:210px;flex-direction:column;gap:6px;align-items:stretch}
.w-rec .rmon{display:flex}
.tmt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.tmc.ok{color:#18CEFB}
.tm{position:relative;height:16px;border-radius:99px;background:linear-gradient(90deg,#ff5c5c33,#f0b42933 35%,#18CEFB44 45%,#18CEFB44 55%,#f0b42933 65%,#ff5c5c33)}
.tmz{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:#fff6}
.tmn{position:absolute;left:50%;top:-4px;width:6px;height:24px;margin-left:-3px;border-radius:3px;background:#f0b429;transition:left .08s linear}
.tmn.ok{background:#18CEFB}
.tmn.idle{background:#3a342d}
.heard{font-family:var(--notes);font-weight:700;font-size:18px;text-align:right;line-height:1.2}
.heard small{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.heard:empty{display:none}
.lis{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#ff5c5c}
.lis i{width:10px;height:10px;border-radius:50%;background:#ff5c5c;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.res{border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:18px;background:#000}
.res-top{display:flex;align-items:center;gap:28px;flex-wrap:wrap}

.bars{flex:1;min-width:240px;display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:80px 1fr 44px;gap:12px;align-items:center;font-weight:600}

.bar .tr i{display:block;height:100%;border-radius:99px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cd{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.cd .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cd .nm{font-family:var(--notes);font-weight:700;font-size:22px}
.cd .nm span{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.cd .sc{font-family:var(--notes);font-weight:700;font-size:18px}
.cd .why{font-size:13px;color:var(--muted);line-height:1.35}
.cd .mini{display:flex;gap:6px}
.cd .mini i{flex:1;height:4px;border-radius:99px}

/* ===== New design (CJ, Nov 21 2026): one screen at a time, kind hints, a small win at the end ===== */
.topbar,.fb,#done{display:none}

.wrap:not(.w-play) .controls{display:none!important}
.w-done #done:not([hidden]){display:flex}
/* Practice | Record toggle as a pill */
.mode{border-radius:999px;padding:4px;gap:2px}
.mode button{border-radius:999px;padding:9px 22px}
.mode button+button{border-left:0}
/* top bar: end round, progress through the round, count */
.topbar{align-items:center;gap:14px;margin:0 0 -6px}
.w-play .stage{padding-top:14px}
.w-play .stage-top{min-height:0}
.tb-x{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:16px;font-weight:600;line-height:1.2;padding:8px 18px 8px 12px;flex:none}
.tb-x svg{width:18px;height:18px;flex:none}
.tb-x:hover{border-color:var(--muted)}
.tb-prog{flex:1;height:10px;border-radius:99px;background:#1c1915;overflow:hidden}
.tb-prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
.tb-count{font-family:var(--notes);font-weight:600;font-size:17px;color:var(--muted);min-width:66px;text-align:right;font-variant-numeric:tabular-nums}
.w-play .controls{justify-content:center;margin-top:12px!important}
/* hint strip under the diagram */
.fb{min-height:76px;border-radius:16px;padding:12px 18px;align-items:center;gap:14px;font-size:19px;font-weight:500;border:1px solid var(--line);color:var(--muted);margin-top:14px;transition:background .2s,border-color .2s}
.fb .ic{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:19px;font-weight:700;border:1px solid var(--line)}
.fb .tx{flex:1;min-width:0}
.fb .tx small{display:block;font-size:15px;opacity:.85;font-weight:400}
.fb.good{background:rgba(60,207,110,.13);border-color:transparent;color:#c4f2d4}
.fb.good .ic{background:#3ccf6e;color:#06210f;border:0}
.fb.soft{background:rgba(240,180,41,.11);border-color:transparent;color:#f6dcae}
.fb.soft .ic{background:#e7b866;color:#2a1c05;border:0}
.facc{font-size:.62em;vertical-align:.55em;font-weight:400;margin-left:.02em}
/* one big button */
.bigrow{margin-top:14px}
.bigrow #nextBtn{display:block;width:100%;min-width:0;padding:15px;font-size:19px;border-radius:14px}
/* round done */
#done{flex-direction:column;align-items:center;text-align:center;gap:20px;padding:12px 0 8px}
.dn-stars{display:flex;gap:10px;justify-content:center}
.dn-stars svg{width:60px;height:60px;display:block}
@keyframes starIn{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.dn-stars .lit{animation:starIn .45s ease-out both}

.dn-btns .btn{padding:15px;font-size:19px;border-radius:14px}

function yin(d,sr){
  const W=Math.floor(d.length/2), tmin=Math.floor(sr/1000), tmax=Math.min(W-1,Math.floor(sr/70)), df=new Float32Array(tmax+1); let run=0, best=-1, t, i;

  if(best<0) return 0;
  const a=df[best-1]||df[best], c=df[best+1]||df[best], dn=a-2*df[best]+c, sh=dn>0?.5*(a-c)/dn:0;

  m.style.width=Math.max(0,Math.min(100,(db+60)/60*100))+'%'; m.classList.toggle('hot',pk>.97);

function dguNoFooter(host,wrap,on){
  const d=document, de=d.documentElement;
  if(!d.getElementById('dgu-nofoot')){ const s=d.createElement('style'); s.id='dgu-nofoot';
    s.textContent='html[data-dgu-tool],html[data-dgu-tool] body,html[data-dgu-tool] #siteWrapper,html[data-dgu-tool] .site-wrapper,html[data-dgu-tool] main,html[data-dgu-tool] #page{background:#000!important}'+
      'html[data-dgu-tool] footer,html[data-dgu-tool] #footer-sections,html[data-dgu-tool] .dgu-below{display:none!important}'+
      'html[data-dgu-tool] .dgu-sec{min-height:0!important}html[data-dgu-tool] .dgu-sec .content-wrapper{padding-bottom:0!important}'+
      'html[data-dgu-tool] .dgu-sec .fluid-engine{grid-template-rows:none!important;grid-auto-rows:auto!important}';
    d.head.appendChild(s); }
  de.setAttribute('data-dgu-tool',''); host.style.setProperty('padding-bottom','12px','important');
  const sec=host.closest('section,.page-section');
  if(sec){ sec.classList.add('dgu-sec'); let n=sec.nextElementSibling; while(n){ n.classList.add('dgu-below'); n=n.nextElementSibling; } }
  const sr=host.shadowRoot; let was=null;
  const headerBottom=()=>{ const h=d.querySelector('header,#header'); if(!h) return 0; const p=getComputedStyle(h).position; if(p!=='fixed'&&p!=='sticky') return 0; return Math.max(0,h.getBoundingClientRect().bottom); };
  // while running, pull the tool's section up so nothing empty sits above it: at the top of the page the tool
  // is right under the header and you can't scroll up into blank space (CJ Nov 22, Steps Drill)
  const lift=sec||host; let lifted=0;
  const headerDocBottom=()=>{ const h=d.querySelector('header,#header'); if(!h) return 0; const p=getComputedStyle(h).position, b=h.getBoundingClientRect().bottom;
    return Math.max(0,(p==='fixed'||p==='sticky')?b:b+window.scrollY); };
  const fit=()=>{ const t=wrap.getBoundingClientRect().top+window.scrollY, want=headerDocBottom()+8;
    lifted=Math.min(0,lifted-(t-want)); lift.style.setProperty('margin-top',lifted+'px','important'); window.scrollTo(0,0); };
  const sync=()=>{ const r=!!on(); if(r===was) return; was=r;
    if(sr) sr.querySelectorAll('.credit').forEach(c=>{ c.style.display=r?'none':''; });
    if(r) requestAnimationFrame(fit); else { lifted=0; lift.style.removeProperty('margin-top'); } };
  window.addEventListener('resize',()=>{ if(was) requestAnimationFrame(fit); });
  new MutationObserver(sync).observe(wrap,{attributes:true,attributeFilter:['class']}); sync();
}
/* Record note (CJ, Nov 22 2026): with Record picked, a small line beside the Practice | Record switch:
   "*Play your answer to get a score."  dguRecNote(modeEl, belowEl?) - modeEl holds buttons data-m="prac" / data-m="rec", the picked one has class "on".
   Without belowEl the switch and the note share a wrapping row (note to the right, drops under it on a phone); with belowEl the note goes on its own line after belowEl. */
function dguRecNote(m,below,text){ if(!m) return; const d=m.ownerDocument, n=d.createElement('span'); n.className='dgu-recnote';
  n.textContent=text||'*Play your answer to get a score.';
  n.style.cssText='font-size:14px;font-weight:400;line-height:1.35;color:var(--muted,#a69b8d)';
  if(below){ n.style.display='block'; n.style.margin='8px 0 0'; below.after(n); }
  else { const row=d.createElement('div'); row.style.cssText='display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px'; m.before(row); row.append(m,n);
    const cs=getComputedStyle(m); row.style.marginTop=cs.marginTop; row.style.marginBottom=cs.marginBottom; m.style.margin='0'; }
  const sync=()=>{ const r=m.querySelector('[data-m="rec"]'); const on=!!(r&&r.classList.contains('on')); n.hidden=!on; };
  new MutationObserver(sync).observe(m,{subtree:true,attributes:true,attributeFilter:['class']}); sync(); }

@media (max-width:560px){.w-play .ftn-row{gap:6px}.w-play .ftn-row .controls,.w-play .ftn-row .controls .toolbar{gap:6px!important}.w-play .ftn-row .controls .btn{padding:7px 10px;font-size:13px}.w-play .ftn-row .controls .icon-btn svg{width:14px;height:14px}.w-play .ftn-row .bigrow{flex-basis:100%}}`; root.appendChild(st);
  const ctl=root.querySelector('.controls'), big=$('bigrow'), fb=$('fb'), row=document.createElement('div'); row.className='ftn-row';
  ctl.before(fb); fb.after(row); row.append(ctl,big); }
dguRecNote($('mode'));
// Space bar (CJ Nov 22): Start on the settings screen, pause / resume while running, Play again at the end; never scrolls the page
dguNoFooter(root.host, root.querySelector('.wrap'), ()=>/w-play|w-done/.test(root.querySelector('.wrap').className));
dguSpace({host:root.host, act:()=>{ if(S&&S.lead) return; if(!S||S.over){ dguTap($('dnAgain'))||dguTap($('nextBtn')); } else togglePause(); }});
settings.tone='acoustic';
renderInst(); renderStrings(); renderNotes(); syncNotesBtn(); syncChroma(); syncMute(); setMode(R.mode);
})();

<!-- Demo video play icon: opens the hidden demo video panel and plays it; Close button or Esc hides it -->
<script>
(function(){
  document.querySelectorAll('[id^="dgu-"]').forEach(function(host){
    var r = host.shadowRoot; if (!r) return;
    // spacing: title closer to the top, more room between title and settings
    var sec = host.closest('section'), cw = sec && sec.querySelector('.content-wrapper');
    if (cw) cw.style.setProperty('padding-top', '36px', 'important');
    host.style.setProperty('padding-top', '8px', 'important');
    var hd = r.querySelector('header'); if (hd) hd.style.marginBottom = '36px';
    var b = r.querySelector('.dgu-play'), p = r.querySelector('.dgu-demo-panel'), x = r.querySelector('.dgu-close');
    var f = p && p.querySelector('iframe');
    if (!b || !p || !f) return;
    function close(){ f.src = 'about:blank'; p.style.display = 'none'; }
    b.addEventListener('click', function(){
      p.style.display = 'block';
      f.src = f.getAttribute('data-src') + '&autoplay=1';
    });
    if (x) x.addEventListener('click', close);
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && p.style.display !== 'none') close(); });
  });
})();
</script>
