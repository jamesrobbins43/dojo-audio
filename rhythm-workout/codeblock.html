0%;background:var(--line);transition:background .05s}\n.heard i.on{background:var(--good)}\n\n/* get-ready (CJ Nov 18) */\n.prep{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:rgba(0,0,0,.86);color:#fff;font-size:clamp(56px,11vw,120px);font-weight:700;line-height:1;pointer-events:none;opacity:0;transition:opacity .35s;border-radius:12px}\n.prep.on{opacity:1}.prep.go{color:#18CEFB}.prep.out{transition:opacity .7s;opacity:0}\n/* demo boxes (CJ Nov 17) */\n.coach{position:absolute;z-index:6;max-width:min(340px,86%);padding:9px 34px 9px 14px;border-radius:10px;background:#000;border:2px solid #18CEFB;color:#fff;font-size:18px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.6);line-height:1.3;text-align:center;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}\n.coach.on{opacity:1;transform:none;pointer-events:auto}\n.coach .ct{text-wrap:balance}\n.coach .cx{position:absolute;top:2px;right:4px;width:28px;height:28px;border:0;background:none;color:#fff;font-size:22px;line-height:1;opacity:.75;padding:0}\n.coach .cx:hover{opacity:1}\n.coach::before{content:\"\";position:absolute;left:var(--px,50%);top:calc(100% + 2px);width:3px;height:22px;background:#18CEFB;transform:translateX(-50%)}\n.coach::after{content:\"\";position:absolute;left:var(--px,50%);top:calc(100% + 22px);transform:translateX(-50%);border:9px solid transparent;border-bottom:0;border-top:11px solid #18CEFB}\n.coach.below::before{top:auto;bottom:calc(100% + 2px)}\n.coach.below::after{top:auto;bottom:calc(100% + 22px);border-top:0;border-bottom:11px solid #18CEFB}\n@media (max-width:560px){\n  :host{padding-block:20px 40px}\n  .sub{font-size:16px}\n  .prow{grid-template-columns:72px minmax(0,1fr);gap:10px}\n  .seg button{font-size:14px;padding:9px 2px}\n  .seg.tempo button{font-size:15px}\n  .sets,.card{padding-left:12px;padding-right:12px}\n  .box{border-width:1.5px;border-radius:6px}\n  .cell{gap:6px}\n  .foot{flex-direction:column;gap:6px}\n  .next{text-align:left;white-space:normal}\n  .coach{font-size:16px;padding:8px 32px 8px 11px}\n  .btn{min-width:96px;padding:10px 12px}\n  .btn.primary{min-width:110px}\n  .r{grid-template-columns:minmax(0,1fr) 70px 44px}\n}\n\nbutton{font:inherit}\nh1,h2,p{margin:0}\n.sub{margin-top:8px}\n" + '</style>' + "<div class=\"wrap\" id=\"wrap\">\n  <header>\n    <h1>Rhythm Workout</h1>\n    <p class=\"sub\">Lock in your strumming hand at any tempo</p>\n  </header>\n\n  <section class=\"sets\" id=\"sets\" aria-label=\"Settings\">\n    <h2>Settings</h2>\n    <div class=\"prow\"><div class=\"lab\">Mode</div>\n      <div class=\"seg\" id=\"mode\" role=\"group\" aria-label=\"Mode\"><button data-v=\"practice\">Practice</button><button data-v=\"record\">Record</button></div></div>\n    <div class=\"prow\"><div class=\"lab\">Tempo</div>\n      <div class=\"seg tempo\" id=\"tempo\" role=\"group\" aria-label=\"Tempo in BPM\"></div></div>\n    <div class=\"prow\"><div class=\"lab\">Workout</div>\n      <div class=\"seg\" id=\"part\" role=\"group\" aria-label=\"Which part\"><button data-v=\"full\">Full</button><button data-v=\"q\">Quarters</button><button data-v=\"e\">Eighths</button><button data-v=\"s\">16ths</button></div></div>\n    <p class=\"note\" id=\"recNote\" hidden>Record listens through your mic and scores your timing. Wear headphones so it only hears you.</p>\n  </section>\n\n  <section class=\"card\" id=\"session\" aria-live=\"off\">\n    <div class=\"top\"><div class=\"prog\" id=\"prog\"></div><div class=\"stage\" id=\"stage\"></div></div>\n    <div class=\"pname\" id=\"pname\"></div>\n    <div class=\"gridwrap\" id=\"gw\">\n      <div class=\"grid\" id=\"grid\"></div>\n      <div class=\"cin\" id=\"cin\" hidden><div class=\"n\" id=\"cinN\">1</div><div class=\"m\" id=\"cinM\">4/4 &#183; 50 BPM</div></div>\n    </div>\n    <div class=\"sync\" id=\"sync\" hidden><div class=\"vtw\" id=\"vtw\"><div class=\"vcue\">STRUM</div><div class=\"vtr\"><div class=\"vfl\ const LAST_BAR=132;
const PARTS={full:[0,12],q:[0,0],e:[1,6],s:[7,12]};
const endBarOf=i=>i+1<PATS.length?PATS[i+1].bar:LAST_BAR;   // first bar after pattern i

// settings (remembered per viewer)
const ST={mode:'practice',tempo:50,part:'full'};
try{ Object.assign(ST,JSON.parse(localStorage.getItem('dgrw:set')||'{}')); }catch(e){}
ST.mode='practice'; // always opens in Practice (CJ Nov 17)
function save(){ try{ localStorage.setItem('dgrw:set',JSON.stringify({tempo:ST.tempo,part:ST.part})); }catch(e){} }
$('tempo').innerHTML=TEMPOS.map(t=>`<button data-v="${t}">${t}</button>`).join('');
function syncSets(){
  for(const [id,v] of [['mode',ST.mode],['tempo',String(ST.tempo)],['part',ST.part]])
    $(id).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  $('recNote').hidden=ST.mode!=='record';
}
function bindSeg(id,key,num){
  $(id).addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||S) return;
    ST[key]=num?+b.dataset.v:b.dataset.v; save(); syncSets(); if(key==='tempo') prefetch(); idle(); });
}
bindSeg('mode','mode'); bindSeg('tempo','tempo',true); bindSeg('part','part');

// ---------- grid ----------
let shown={pi:-1,res:0,demo:false};
function drawGrid(pi){
  const p=PATS[pi], res=STAGES[p.st].res, step=4/res, lab=res===1?['']:res===2?['','&']:['','e','&','a'];
  let h='';
  for(let b=0;b<4;b++){
    h+='<div class="beat">';
    for(let k=0;k<res;k++){ const s=b*4+k*step, hit=p.g[s]==='X';
      h+=`<div class="cell${hit?' hit':''}${k===0?' bn':''}" data-s="${s}"><div class="box"></div><div class="ct">${k===0?b+1:lab[k]}</div></div>`; }
    h+='</div>';
  }
  $('grid').innerHTML=h; $('grid').classList.toggle('even',res===2); shown.pi=pi; shown.res=res; nowCell=null;
  $('pname').textContent=p.name; $('stage').textContent=STAGES[p.st].name; $('tip').textContent=p.tip;
}
let nowCell=null;
function setNow(s16){ // light the cell the playhead is in
  const step=4/shown.res, s=s16<0?-1:Math.floor(s16/step)*step;
  const c=s<0?null:$('grid').querySelector(`.cell[data-s="${s}"]`);
  if(c===nowCell) return; if(nowCell) nowCell.classList.remove('now'); nowCell=c; if(c) c.classList.add('now');
}
function flash(pi,s,cls){ if(shown.pi!==pi) return; const c=$('grid').querySelector(`.cell[data-s="${s}"]`); if(!c) return;
  c.classList.remove('good','close','miss'); void c.offsetWidth; c.classList.add(cls); setTimeout(()=>c.classList.remove(cls),380); }
function progText(pi,first,last,bar){
  const n=pi-first+1, tot=last-first+1, bIn=bar-PATS[pi].bar+1, bTot=endBarOf(pi)-PATS[pi].bar;
  return `Pattern ${n} <span class="of">of ${tot}</span> &nbsp;\xb7&nbsp; Bar ${Math.max(1,bIn)} <span class="of">of ${bTot}</span>`;
}

// ---------- audio ----------
let ctx=null, S=null; const cache={}, bufs={};
function audio(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); return ctx; }
function prefetch(){ const t=ST.tempo; if(!cache[t]) cache[t]=fetch(AUDIO_BASE+'rw-'+t+'.mp3').then(r=>{ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).catch(e=>{ delete cache[t]; throw e; }); return cache[t]; }
async function loadTrack(t){
  if(bufs[t]) return bufs[t];
  const ab=await prefetch(); const buf=await new Promise((ok,no)=>audio().decodeAudioData(ab.slice(0),ok,no));
  // find the first count-in click so the beat grid lines up exactly with this file
  const d=buf.getChannelData(0); let i=0; while(i<d.length&&Math.abs(d[i])<0.002) i++;
  const beat=60/t, click=i/buf.sampleRate, t0=click+4*beat;
  const a=Math.max(0,i-Math.round(.004*buf.sampleRate)), n=Math.round(.28*buf.sampleRate);
  const cb=audio().createBuffer(1,n,buf.sampleRate); cb.getChannelData(0).set(d.subarray(a,a+n));
  return bufs[t]={buf,t0,beat,bar:4*beat,s16:beat/4,clickBuf:cb};
}
const outLat=()=>ctx?(ctx.outputLatency||ctx.baseLatency||0):0;
function pos(){ return ctx.currentTime-S.startCtx+S.startPos-outLat(); }

function launch(bar){ // play from the start of `bar` with a one-bar count-in
  const T=S.T, now=ctx.currentTime+0.15, barPos=T.t0+(bar-1)*T.bar;
  const src=ctx.createBufferSource(), g=ctx.createGain(); src.buffer=T.buf; src.connect(g).connect(ctx.destination);
  if(bar===1){ S.startPos=0; S.startCtx=now; src.start(now,0); }           // the track's own count-in clicks
  else{ S.startPos=barPos-4*T.beat; S.startCtx=now;
    for(let k=0;k<4;k++){ const c=ctx.createBufferSource(); c.buffer=T.clickBuf; c.connect(ctx.destination); c.start(now+k*T.beat); }
    src.start(now+4*T.beat,barPos); }
  if(S.endPos<T.buf.duration-0.05){ const tEnd=S.startCtx+(S.endPos-S.startPos); g.gain.setValueAtTime(1,tEnd); g.gain.linearRampToValueAtTime(0,tEnd+0.6); src.stop(tEnd+0.7); }
  S.src=src; S.cinEnd=barPos; S.paused=false;
}

// ---------- record (mic onsets) ----------
const WORKLET=`class O extends AudioWorkletProcessor{constructor(){super();this.p=0;this.f=0;this.fl=0.002;this.last=-1}
process(inp){const ch=inp[0]&&inp[0][0];if(!ch)return true;let e=0,pv=this.p;for(let i=0;i<ch.length;i++){const d=ch[i]-pv;pv=ch[i];e+=d*d}this.p=pv;e=Math.sqrt(e/ch.length);
const t=currentTime;if(e>Math.max(0.006,this.fl*6)&&e>this.f*1.8&&t-this.last>0.07){this.last=t;this.port.postMessage(t)}
this.f=e;this.fl=e<this.fl?this.fl*0.9+e*0.1:this.fl*1.0015;return true}}registerProcessor('rw-onset',O);`;
let mic=null;
async function micOn(){
  if(mic) return true;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const srcN=audio().createMediaStreamSource(stream);
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET],{type:'application/javascript'})));
    const node=new AudioWorkletNode(ctx,'rw-onset'); const sink=ctx.createGain(); sink.gain.value=0;
    srcN.connect(node).connect(sink).connect(ctx.destination);
    node.port.onmessage=e=>onset(e.data);
    mic={stream,node}; return true;
  }catch(e){ return false; }
}
let CAL=null; // measured input delay from the bar sync (this visit)
const IN_LAT=0.012;
function onset(tc){
  if(VS){ VS.ons.push(tc); }
  const d=$('heardDot'); d.classList.add('on'); clearTimeout(d._t); d._t=setTimeout(()=>d.classList.remove('on'),90);
  if(!S||S.paused||!S.rec) return;
  S.on.push(tc-S.startCtx+S.startPos-outLat()-(CAL!=null?CAL:IN_LAT));
}
function judge(p){ // grade each expected strum once it has passed
  const E=S.exp;
  while(S.ei<E.length && E[S.ei].t+0.16<p){
    const e=E[S.ei++]; let best=-1,bd=1;
    for(let j=0;j<S.on.length;j++){ const dd=S.on[j]-e.t; if(Math.abs(dd)<Math.abs(bd)&&!S.used[j]){ bd=dd; best=j; } }
    if(best>=0&&Math.abs(bd)<=0.12){ S.used[best]=1; e.d=bd; e.r=Math.abs(bd)<=0.05?'good':'close'; } else e.r='miss';
    flash(e.pi,e.s,e.r);
  }
  const done=E.slice(0,S.ei); if(done.length){ const sc=score(done); $('stage').innerHTML=`<span class="live">On time <b>${sc.pc}%</b></span>`; }
}
function score(list){
  const g=list.filter(e=>e.r==='good').length, c=list.filter(e=>e.r==='close').length, m=list.filter(e=>e.r==='miss').length;
  const ds=list.filter(e=>e.d!=null).map(e=>e.d); const mean=ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:0;
  return {g,c,m,n:list.length,pc:list.length?Math.round(100*(g+.5*c)/list.length):0,mean};
}
function lean(ms){ return Math.abs(ms)<15?'Locked in':ms<0?`Rushing ${Math.round(-ms)} ms`:`Dragging ${Math.round(ms)} ms`; }

// ---------- run ----------
function lock(on){ $('sets').classList.toggle('locked',on); $('startBtn').disabled=on; $('pauseBtn').disabled=!on; $('stopBtn').disabled=!on; }
async function start(){
  audio(); demoStop(); const rec=ST.mode==='record';
  lock(true); $('session').classList.remove('done'); $('res').hidden=true; $('gw').hidden=false; $('sync').hidden=true; $('pauseBtn').textContent='Pause';
  if(rec){ $('prog').textContent='Turning on the mic\u2026'; if(!await micOn()){ lock(false); $('prog').textContent=''; $('tip').textContent='Record needs the microphone. Allow mic access in your browser and press Start again.'; return; } $('heard').hidden=false;
    if(CAL==null){ vsync(); return; } } // sync timing first, once per visit (CJ Nov 19)
  $('prog').textContent='Loading\u2026';
  const [first,last]=PARTS[ST.part];
  const ready=new Promise(r=>prep($('session'),r));   // 4 s Ready / Begin (CJ Nov 18)
  let T; try{ T=await loadTrack(ST.tempo); }catch(e){ prepCancel($('session')); lock(false); $('prog').textContent='Couldn\u2019t load the track. Check your connection and try again.'; return; }
  drawGrid(first); setNow(-1); $('tfill').style.width='0%'; $('prog').innerHTML=progText(first,first,last,PATS[first].bar); $('next').classList.remove('on');
  await ready; if(!$('startBtn').disabled) return; // stopped while getting ready
  const endBar=endBarOf(last);
  S={T,first,last,rec,startBar:PATS[first].bar,endPos:last===PATS.length-1?T.buf.duration:T.t0+(endBar-1)*T.bar+0.25*T.beat,
     runFrom:T.t0+(PATS[first].bar-1)*T.bar,on:[],used:[],exp:[],ei:0};
  if(rec){ for(let pi=first;pi<=last;pi++){ const p=PATS[pi]; for(let b=p.bar;b<endBarOf(pi);b++) for(let s=0;s<16;s++) if(p.g[s]==='X') S.exp.push({t:T.t0+(b-1)*T.bar+s*T.s16,pi,s}); }
    if(last===PATS.length-1) S.exp.push({t:T.t0+(LAST_BAR-1)*T.bar,pi:last,s:0}); }
  launch(S.startBar); $('cinM').textContent=`4/4 \xb7 ${ST.tempo} BPM`;
  requestAnimationFrame(tick);
}
function tick(){
  if(!S||S.paused) return;
  const T=S.T, p=pos();
  if(p<S.cinEnd){ const n=Math.floor((p-(S.cinEnd-4*T.beat))/T.beat)+1; $('cin').hidden=false; $('cinN').textContent=Math.min(4,Math.max(1,n)); setNow(-1); }
  else{
    $('cin').hidden=true;
    const bar=Math.floor((p-T.t0)/T.bar)+1, s16=Math.floor((p-T.t0-(bar-1)*T.bar)/T.s16);
    let pi=S.first; while(pi<S.last&&PATS[pi+1].bar<=bar) pi++;
    if(shown.pi!==pi||shown.demo){ shown.demo=false; drawGrid(pi); }
    if(bar<LAST_BAR) setNow(s16); else setNow(-1);
    $('prog').innerHTML=progText(pi,S.first,S.last,Math.min(bar,endBarOf(pi)-1));
    const nb=endBarOf(pi); const nx=$('next');
    if(pi<S.last&&bar>=nb-2){ nx.innerHTML=`<span>Next:</span> ${PATS[pi+1].name}`; nx.classList.add('on'); } else nx.classList.remove('on');
    if(!S.rec) $('stage').textContent=STAGES[PATS[pi].st].name;
  }
  $('tfill').style.width=Math.max(0,Math.min(100,100*(p-S.runFrom)/(S.endPos-S.runFrom)))+'%';
  if(S.rec) judge(p);
  if(p>=S.endPos+(S.rec?0.2:0)) return finish(true);
  requestAnimationFrame(tick);
}
function pause(){
  if(!S) return;
  if(!S.paused){ const p=pos(); S.paused=true; try{S.src.stop();}catch(e){} S.resumeBar=p<S.T.t0?1:Math.max(S.startBar,Math.floor((p-S.T.t0)/S.T.bar)+1);
    $('pauseBtn').textContent='Resume'; $('cin').hidden=true; return; }
  // resume from the start of the bar you stopped in, with a fresh count-in
  $('pauseBtn').textContent='Pause';
  if(S.rec){ const t=S.T.t0+(S.resumeBar-1)*S.T.bar; S.exp=S.exp.filter(e=>e.r||e.t>=t); S.ei=S.exp.findIndex(e=>!e.r); if(S.ei<0) S.ei=S.exp.length; S.on=[]; S.used=[]; }
  launch(S.resumeBar); requestAnimationFrame(tick);
}
function finish(done){
  if(!S) return; const R=S; S=null; try{R.src.stop();}catch(e){}
  lock(false); $('cin').hidden=true; setNow(-1); $('next').classList.remove('on'); $('heard').hidden=true;
  if(!done&&!R.rec){ idle(); return; }
  $('session').classList.add('done');
  $('gw').hidden=true; $('res').hidden=false; $('tfill').style.width=done?'100%':$('tfill').style.width;
  const nextT=TEMPOS[TEMPOS.indexOf(ST.tempo)+1];
  if(!R.rec){
    $('prog').textContent=''; $('stage').textContent=''; $('pname').textContent='Workout complete!';
    $('res').innerHTML=`<p class="line">Nice work at <b>${ST.tempo} BPM</b>. ${nextT?`Run it again, or try it at <b>${nextT} BPM</b>.`:'That\u2019s the top tempo. Try your chord progression over it next.'}</p>`;
    $('tip').textContent='This one pays off over time. Record yourself playing a song now, then again after a few weeks of this workout.';
    return;
  }
  const list=R.exp.filter(e=>e.r); const sc=score(list);
  $('prog').textContent=''; $('stage').textContent=''; $('pname').textContent=done?'Your score':'Your score so far';
  let rows=''; for(let pi=R.first;pi<=R.last;pi++){ const l=list.filter(e=>e.pi===pi); if(!l.length) continue; const s=score(l);
    rows+=`<div class="r"><div>${PATS[pi].name} <span class="lean">\xb7 ${lean(s.mean*1000)}</span></div><div class="bar"><i style="width:${s.pc}%"></i></div><div class="pc">${s.pc}%</div></div>`; }
  $('res').innerHTML=list.length?`<div class="big">${sc.pc}<small>%</small></div>
    <p class="line">On time <b>${sc.g}</b> &nbsp;\xb7&nbsp; Close <b>${sc.c}</b> &nbsp;\xb7&nbsp; Missed <b>${sc.m}</b> &nbsp;\xb7&nbsp; ${lean(sc.mean*1000)}</p><div class="rows">${rows}</div>`
    :'<p class="line">No strums were scored yet.</p>';
  $('tip').textContent=sc.pc>=90&&nextT?`Great timing. Try ${nextT} BPM next.`:'On time = within 50 ms of the beat. Close = within 120 ms.';
}
function stop(){ if(VS){ vsEnd('Sync stopped. Press Start to try again.'); return; } if(!S){ prepCancel($('session')); lock(false); idle(); return; } finish(false); }

$('startBtn').onclick=start; $('pauseBtn').onclick=pause; $('stopBtn').onclick=stop;

// ---------- Record sync (CJ Nov 19): a slow bar fills to the end, strum when it gets there; 4 times, random pauses, no rhythm needed ----------
let VS=null;
function vsync(){
  $('gw').hidden=true; $('res').hidden=true; $('sync').hidden=false; $('vtw').hidden=false; $('next').classList.remove('on'); $('tfill').style.width='0%';
  $('pname').textContent='Strum down when the bar reaches the end'; $('stage').textContent='Sync timing';
  $('tip').textContent='Mute the strings with your fretting hand. No rhythm needed: just watch the bar.';
  $('vsn').textContent=''; $('vsn').className='vsn';
  VS={res:[],ons:[],n:1,miss:0,g:0}; vsRound(0.8);
}
function vsRound(pause){
  if(!VS) return; const t0=ctx.currentTime+pause, g=t0+2.5; VS.g=g;
  $('prog').innerHTML=`Strum <b>${VS.n}</b> <span class="of">of 4</span>`;
  const f=()=>{ if(!VS||VS.g!==g) return; const now=ctx.currentTime;
    $('vfl').style.width=Math.max(0,Math.min(1,(now-t0)/2.5))*100+'%'; $('vtw').classList.toggle('hit',now>=g&&now<g+.35);
    if(now>g+.7) return vsJudge(); VS.raf=requestAnimationFrame(f); };
  f();
}
function vsJudge(){
  const g=VS.g, hit=VS.ons.find(t=>t>=g-.6&&t<=g+.7); VS.ons=[]; $('vfl').style.width='0%'; $('vtw').classList.remove('hit');
  if(hit==null){
    if(++VS.miss>=3) return vsEnd('Couldn\u2019t hear your strums. Check your mic and press Start to sync again.');
    $('vsn').className='vsn bad'; $('vsn').textContent='Didn\u2019t hear a strum. Strum a little harder and let\u2019s do that one again.'; return vsRound(1.2+Math.random());
  }
  VS.miss=0; $('vsn').className='vsn'; $('vsn').textContent=''; VS.res.push(hit-g);
  if(VS.res.length>=4) return vsDone();
  VS.n++; vsRound(1+Math.random()*1.6);
}
function vsDone(){
  const r=[...VS.res].sort((a,b)=>a-b), mid=(r[1]+r[2])/2, dv=r.map(v=>Math.abs(v-mid)).sort((a,b)=>a-b), spread=(dv[1]+dv[2])/2;
  if(spread>.06) return vsEnd('Those strums were pretty spread out. Press Start to sync again.');
  if(Math.abs(mid)>.25) return vsEnd(`That came out ${Math.round(Math.abs(mid)*1000)} ms ${mid>0?'late':'early'}. Press Start to sync again.`);
  CAL=Math.max(0,mid); vsEnd(null);
}
function vsEnd(msg){
  if(VS) cancelAnimationFrame(VS.raf); VS=null; lock(false); $('heard').hidden=true; $('vfl').style.width='0%'; $('vtw').classList.remove('hit');
  if(msg){ $('vsn').className='vsn bad'; $('vsn').textContent=msg; return; }
  $('vtw').hidden=true; $('prog').textContent=''; $('stage').textContent='Sync timing';
  $('pname').textContent='Synced \u2713'; $('vsn').className='vsn'; $('vsn').textContent=`Your mic delay is ${Math.round(CAL*1000)} ms. Record will allow for it when it scores you.`;
  $('tip').textContent='Press Start to record.';
}

// ---------- get ready (CJ Nov 18) ----------
function prep(host,done){ let o=host.querySelector(':scope > .prep'); if(!o){ o=document.createElement('div'); o.className='prep'; o.setAttribute('aria-live','assertive'); host.appendChild(o); }
  prepCancel(host); o.textContent='Ready'; void o.offsetWidth; o.classList.add('on');
  o._t=[setTimeout(()=>{ o.textContent='Begin'; o.classList.add('go'); },2500), setTimeout(()=>o.classList.add('out'),3300), setTimeout(()=>{ o.className='prep'; if(done) done(); },4000)]; }
function prepCancel(host){ const o=host.querySelector(':scope > .prep'); if(!o) return; (o._t||[]).forEach(clearTimeout); o._t=[]; o.className='prep'; }

// ---------- start screen demo (CJ Nov 17): blue, silent, plays twice, then "Press Start when ready" ----------
const DEMOS=[{pi:0,box:'Strum on every lit box'},{pi:3,box:'Count out loud as the light moves'}];
let demoT=null, demoRaf=0;
function coach(el,text,below){
  const host=$('wrap'); let c=host.querySelector(':scope > .coach');
  if(!el){ if(c) c.classList.remove('on'); return; }
  if(!c){ c=document.createElement('div'); c.className='coach'; c.setAttribute('aria-live','polite'); host.appendChild(c);
    c.innerHTML='<span class="ct"></span><button type="button" class="cx" aria-label="Close the how-to">&times;</button>';
    c.querySelector('.cx').onclick=()=>{ c.classList.remove('on'); demoX(); }; }
  c.classList.remove('on'); c.querySelector('.ct').textContent=text.replace(/ (\S+)$/,'\xa0$1'); c.classList.toggle('below',!!below);
  const hr=host.getBoundingClientRect(), r=el.getBoundingClientRect(), cw=c.offsetWidth, chh=c.offsetHeight;
  const cx=r.left+r.width/2-hr.left, left=Math.max(4,Math.min(hr.width-cw-4,cx-cw/2));
  c.style.left=left+'px'; c.style.top=(below?r.bottom-hr.top+48:r.top-hr.top-chh-48)+'px';
  c.style.setProperty('--px',Math.max(14,Math.min(cw-14,cx-left))+'px');
  void c.offsetWidth; c.classList.add('on');
}
function demoX(){ clearTimeout(demoT); demoT=null; cancelAnimationFrame(demoRaf); }
function demoStop(){ demoX(); $('session').classList.remove('demo'); coach(null); }
function idle(){
  demoStop(); $('session').classList.remove('done'); $('sync').hidden=true; $('res').hidden=true; $('gw').hidden=false; $('cin').hidden=true; $('next').classList.remove('on');
  $('session').classList.add('demo'); $('prog').innerHTML='<span class="tag">Example</span>';
  coach($('sets'),'First pick your settings');
  demoT=setTimeout(()=>runDemo(0),4000);
}
function runDemo(i){
  if(i>=2*DEMOS.length){ cancelAnimationFrame(demoRaf); setNow(-1); coach($('startBtn'),'Press Start when ready'); demoT=setTimeout(()=>coach(null),6000); return; }
  const ex=DEMOS[i%DEMOS.length]; drawGrid(ex.pi); shown.demo=true; coach($('grid'),ex.box,true);
  const t0=performance.now(), beat=60/72*1000, base=(i%DEMOS.length)*11000;
  const f=()=>{ const ms=performance.now()-t0; setNow(Math.floor(ms/(beat/4))%16); $('tfill').style.width=Math.min(100,100*(base+ms)/22000)+'%'; demoRaf=requestAnimationFrame(f); };
  cancelAnimationFrame(demoRaf); f();
  demoT=setTimeout(()=>runDemo(i+1),11000);
}

syncSets(); prefetch(); idle();
})();
})();
</script>
